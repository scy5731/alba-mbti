/* 축 점수 → 유형 매칭 */
function typeScore(code, t) {
  let s = 0;
  s += code[0] === "E" ? t.social : (6 - t.social);
  s += code[1] === "D" ? t.physical : (6 - t.physical);
  s += code[2] === "F" ? (t.flex ? 3 : 0) : (t.flex ? 0 : 2);
  s += code[3] === "P" ? t.pay : t.learn;
  return s;
}
function recommendTypes(code) {
  const ranked = TYPES.map((t) => ({ t, s: typeScore(code, t) })).sort((a, b) => b.s - a.s);
  const max = ranked[0].s || 1;
  return ranked.map((r) => ({ ...r, pct: Math.min(98, 60 + Math.round((r.s / max) * 38)) }));
}
// 코드 vs 유형 — 축별로 잘 맞는 이유를 문장으로 생성(강한 것 순으로 최대 3개)
function matchReasons(code, t) {
  const r = [];
  if (code[0] === "E" && t.social >= 4) r.push("손님·동료 응대가 많아 응대형인 당신에게 활력이 돼요");
  if (code[0] === "I" && t.social <= 2) r.push("혼자 조용히 할 수 있어 독립형인 당신에게 편해요");
  if (code[1] === "D" && t.physical >= 4) r.push("계속 몸을 움직여 활동형인 당신에게 시간이 잘 가요");
  if (code[1] === "C" && t.physical <= 2) r.push("체력 부담이 적어 차분형인 당신에게 잘 맞아요");
  if (code[2] === "F" && t.flex) r.push("단기·유연 근무라 유연형인 당신과 궁합이 좋아요");
  if (code[2] === "S" && !t.flex) r.push("꾸준히 다니기 좋아 성실형인 당신에게 안정적이에요");
  if (code[3] === "P" && t.pay >= 3) r.push("시급이 괜찮아 실속형인 당신에게 매력적이에요");
  if (code[3] === "G" && t.learn >= 4) r.push("배울 게 많아 성장형인 당신에게 도움이 돼요");
  return r.slice(0, 3);
}
function relatedBasics(code) {
  const beginnerish = code[3] === "G";
  return beginnerish ? BASICS.filter((b) => ["contract","firstday","interview","wage"].includes(b.id))
                     : BASICS.filter((b) => ["contract","wage","weekly","safety"].includes(b.id));
}
// 응답(letter 배열) → { code, axisPct: [{a,b,lead,pct}] }
function computeResult(letters) {
  const axisPct = AXES.map(([A, B], i) => {
    const qs = QUIZ.map((q, idx) => ({ q, idx })).filter((x) => x.q.ax === i);
    const aCount = qs.filter((x) => letters[x.idx] === A).length;
    const total = qs.length;
    const lead = aCount >= total - aCount ? A : B;
    const pct = Math.round((Math.max(aCount, total - aCount) / total) * 100);
    return { a: A, b: B, aCount, total, lead, pct };
  });
  return { code: axisPct.map((x) => x.lead).join(""), axisPct };
}

let tossLoading = null;
function loadToss() {
  if (window.TossPayments) return Promise.resolve(window.TossPayments);
  if (tossLoading) return tossLoading;
  tossLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://js.tosspayments.com/v2/standard";
    s.onload = () => resolve(window.TossPayments);
    s.onerror = () => { tossLoading = null; reject(new Error("SDK 로드 실패")); };
    document.head.appendChild(s);
  });
  return tossLoading;
}

function App() {
  const hasRedirect = typeof window !== "undefined" && new URLSearchParams(window.location.search).get("paymentKey");
  const [screen, setScreen] = useState(hasRedirect ? "confirm" : "intro");
  const [result, setResult] = useState(LS.get("result", null));
  const [guide, setGuide] = useState(null);
  const [guideFrom, setGuideFrom] = useState("result");
  const [clientKey, setClientKey] = useState("");

  useEffect(() => {
    fetch("/api/config").then((r) => r.json()).then((d) => setClientKey((d && d.tossClientKey) || "")).catch(() => {});
    const params = new URLSearchParams(window.location.search);
    const clean = () => window.history.replaceState({}, "", window.location.pathname);
    if (params.get("tossfail")) { clean(); alert("결제가 취소되었거나 실패했어요."); return; }
    const paymentKey = params.get("paymentKey");
    if (paymentKey) {
      apiSend("/api/confirm", { paymentKey, orderId: params.get("orderId"), amount: params.get("amount") }).then((d) => {
        clean();
        if (d && d.ok) {
          const cur = LS.get("result", null);
          if (cur) { const r = { ...cur, paid: true }; setResult(r); LS.set("result", r); setScreen("result"); }
          else setScreen("intro");
        } else {
          alert("결제 확인에 실패했어요. " + ((d && d.error) || ""));
          setScreen(LS.get("result", null) ? "pay" : "intro");
        }
        window.scrollTo(0, 0);
      });
    }
  }, []);

  const start = (prev) => { if (prev && result) setScreen(result.paid ? "result" : "pay"); else setScreen("quiz"); };
  const done = (letters) => { const r = { ...computeResult(letters), paid: false }; setResult(r); LS.set("result", r); setScreen("pay"); window.scrollTo(0, 0); };
  const onPaid = () => { const r = { ...result, paid: true }; setResult(r); LS.set("result", r); setScreen("result"); window.scrollTo(0, 0); };
  const openGuide = (t, from = "result") => { setGuide(t); setGuideFrom(from); setScreen("guide"); window.scrollTo(0, 0); };
  const openBrowse = () => { setScreen("browse"); window.scrollTo(0, 0); };
  return (
    <div className="phone noscroll">
      {screen === "confirm" && (
        <div className="min-h-screen flex flex-col items-center justify-center text-gray-400 gap-3">
          <div className="text-4xl animate-pulse">💳</div><div className="font-bold">결제를 확인하고 있어요…</div>
        </div>
      )}
      {screen === "intro" && <Intro onStart={start} onBrowse={openBrowse} prev={result} />}
      {screen === "browse" && <Browse onBack={() => setScreen("intro")} onGuide={(t) => openGuide(t, "browse")} />}
      {screen === "quiz" && <Quiz onDone={done} onBack={() => setScreen("intro")} />}
      {screen === "pay" && result && <Pay result={result} clientKey={clientKey} onPaid={onPaid} onBack={() => setScreen("intro")} />}
      {screen === "result" && result && result.paid && <Result result={result} onRetry={() => setScreen("quiz")} onGuide={openGuide} />}
      {screen === "guide" && guide && <Guide target={guide} onBack={() => setScreen(guideFrom)} backLabel={guideFrom === "browse" ? "‹ 목록으로" : "‹ 결과로"} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // 서비스워커 등록(설치형 PWA). HTTPS 또는 localhost에서만 동작.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
