function PostDetail({ id, onBack, onEdit, onDeleted, onChanged }) {
  const [post, setPost] = useState(null);
  const [comments, setComments] = useState([]);
  const [text, setText] = useState("");
  const [anon, setAnon] = useState(false);
  const [busy, setBusy] = useState(false);
  const [gone, setGone] = useState(false);

  const load = async () => {
    const d = await api("GET", "/api/posts/" + id);
    if (d.ok) { setPost(d.post); setComments(d.comments); } else setGone(true);
  };
  useEffect(() => { load(); }, [id]);

  const like = async () => {
    const d = await api("POST", `/api/posts/${id}/like`);
    if (d.ok) { setPost((p) => ({ ...p, liked: d.liked, likes: d.likes })); onChanged && onChanged(); }
  };
  const comment = async () => {
    if (busy || !text.trim()) return;
    setBusy(true);
    const d = await api("POST", `/api/posts/${id}/comments`, { body: text, anon });
    setBusy(false);
    if (d.ok) { setComments((cs) => [...cs, d.comment]); setText(""); onChanged && onChanged(); }
    else alert(d.error || "댓글 등록에 실패했어요.");
  };
  const delPost = async () => {
    if (!window.confirm("이 글을 지울까요? 댓글도 함께 사라져요.")) return;
    const d = await api("DELETE", "/api/posts/" + id);
    if (d.ok) onDeleted(); else alert(d.error || "삭제에 실패했어요.");
  };
  const delComment = async (c) => {
    if (!window.confirm("댓글을 지울까요?")) return;
    const d = await api("DELETE", "/api/comments/" + c.id);
    if (d.ok) { setComments((cs) => cs.filter((x) => x.id !== c.id)); onChanged && onChanged(); }
  };
  const report = async (type, targetId) => {
    const reason = window.prompt("신고 사유를 적어주세요 (욕설, 광고, 허위정보 등)");
    if (reason === null) return;
    const d = await api("POST", "/api/reports", { targetType: type, targetId, reason });
    alert(d.ok ? "신고했어요. 관리자가 확인할게요." : (d.error || "신고에 실패했어요."));
  };

  if (gone) return (
    <div className="min-h-screen bg-gray-50">
      <TopBar onBack={onBack} label="커뮤니티" />
      <p className="text-center text-gray-500 pt-16">사라진 글이에요.</p>
    </div>
  );
  if (!post) return (
    <div className="min-h-screen bg-gray-50">
      <TopBar onBack={onBack} label="커뮤니티" />
      <p className="text-center text-gray-400 pt-16">불러오는 중…</p>
    </div>
  );

  const c = catOf(post.category);
  return (
    <div className="pb-32 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label="커뮤니티" />

      <div className="bg-white px-5 py-5">
        <div className="flex items-center gap-1.5">
          <span className="text-[11px] font-bold text-brand bg-brandLt px-2 py-0.5 rounded-full">{c.emoji} {c.label}</span>
          <span className="text-[11px] text-gray-400">{ago(post.createdAt)}{post.updatedAt ? " · 수정됨" : ""}</span>
        </div>
        <h1 className="text-[20px] font-extrabold text-gray-900 mt-2 leading-snug">{post.title}</h1>
        <div className="flex items-center gap-2 mt-2 text-[12px] text-gray-500">
          <Author author={post.author} anon={post.anon} />
        </div>
        <p className="text-[15px] text-gray-800 leading-relaxed mt-4 whitespace-pre-wrap">{post.body}</p>

        <div className="flex items-center gap-2 mt-5">
          <button onClick={like}
            className={"flex-1 py-2.5 rounded-xl font-bold text-[14px] press border " +
              (post.liked ? "bg-brandLt border-brand text-brand" : "bg-white border-gray-200 text-gray-600")}>
            {post.liked ? "❤️" : "🤍"} 좋아요 {post.likes}
          </button>
          {post.canEdit ? (
            <>
              {post.mine && <button onClick={() => onEdit(post)} className="px-4 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-bold text-[14px] press">수정</button>}
              <button onClick={delPost} className="px-4 py-2.5 rounded-xl border border-gray-200 text-red-500 font-bold text-[14px] press">삭제</button>
            </>
          ) : (
            <button onClick={() => report("post", post.id)} className="px-4 py-2.5 rounded-xl border border-gray-200 text-gray-400 font-bold text-[14px] press">신고</button>
          )}
        </div>
      </div>

      {/* 댓글 */}
      <div className="bg-white mt-2 px-5 py-4">
        <div className="text-[13px] font-bold text-gray-800">댓글 {comments.length}</div>
        <div className="mt-3 divide-y divide-gray-50">
          {comments.length === 0 && <p className="text-[13px] text-gray-400 py-4">첫 댓글을 남겨보세요.</p>}
          {comments.map((cm) => (
            <div key={cm.id} className="py-3">
              <div className="flex items-center justify-between text-[12px] text-gray-500">
                <Author author={cm.author} anon={cm.anon} />
                <div className="flex items-center gap-2 shrink-0">
                  <span className="text-gray-300">{ago(cm.createdAt)}</span>
                  {cm.canEdit
                    ? <button onClick={() => delComment(cm)} className="text-red-400 font-semibold">삭제</button>
                    : <button onClick={() => report("comment", cm.id)} className="text-gray-300 font-semibold">신고</button>}
                </div>
              </div>
              <p className="text-[14px] text-gray-800 mt-1.5 leading-relaxed whitespace-pre-wrap">{cm.body}</p>
            </div>
          ))}
        </div>
      </div>

      {/* 댓글 입력 */}
      <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-gray-100 px-4 py-2.5 pb-[calc(10px+env(safe-area-inset-bottom))] z-30">
        <div className="flex items-center gap-2">
          <button onClick={() => setAnon(!anon)}
            className={"shrink-0 px-2.5 py-2 rounded-lg text-[12px] font-bold press " + (anon ? "bg-brand text-white" : "bg-gray-100 text-gray-400")}>
            🕶 익명
          </button>
          <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && comment()}
            placeholder="댓글 달기…" maxLength={1000}
            className="flex-1 min-w-0 px-3.5 py-2.5 text-[14px] bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand" />
          <button disabled={busy || !text.trim()} onClick={comment}
            className="shrink-0 px-4 py-2.5 bg-brand disabled:bg-gray-200 disabled:text-gray-400 text-white font-bold rounded-xl press text-[14px]">등록</button>
        </div>
      </div>
    </div>
  );
}

const HOME_NAV = { tab: "home", overlay: null, guide: null, detailFrom: "home", typesCat: "all" };

function App() {
  const [tab, setTab] = useState("home");          // home | types | guideList | calc | faq
  const [overlay, setOverlay] = useState(null);     // null | quiz | result | detail | account | admin (탭바 숨김)
  const [result, setResult] = useState(LS.get("result", null));
  const [guide, setGuide] = useState(null);
  const [detailFrom, setDetailFrom] = useState("home"); // 탭 key 또는 "result"
  const [typesCat, setTypesCat] = useState("all");
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);  // /api/auth/me 확인 완료 여부
  const [postId, setPostId] = useState(null);        // 커뮤니티: 열어본 글
  const [editPost, setEditPost] = useState(null);    // 커뮤니티: 수정 중인 글
  const [feedKey, setFeedKey] = useState(0);         // 목록 새로고침 트리거
  const [payCfg, setPayCfg] = useState(null);        // /api/pay/config — 결제 켜짐 여부·가격

  /* ---------- 뒤로가기(모바일 하드웨어 버튼 / 브라우저) ----------
     화면 전환마다 history 항목을 쌓고, popstate에서 그 화면 상태로 되돌린다.
     이게 없으면 뒤로가기가 앱을 그대로 나가버린다.
     화면 상태(nav)는 전부 직렬화 가능한 값이라 history.state에 그대로 넣는다. */
  const navRef = useRef(HOME_NAV);
  const applyNav = (s) => {
    setTab(s.tab); setOverlay(s.overlay); setGuide(s.guide);
    setDetailFrom(s.detailFrom); setTypesCat(s.typesCat);
    window.scrollTo(0, 0);
  };
  // 화면 이동 — 바뀌는 값만 넘기면 나머지는 현재 화면에서 이어받는다
  const go = (patch) => {
    const next = { ...navRef.current, ...patch };
    navRef.current = next;
    window.history.pushState({ nav: next }, "");
    applyNav(next);
  };
  // 앱 안의 ‹ 버튼도 하드웨어 뒤로가기와 똑같이 동작시킨다(히스토리가 쌓이지 않도록)
  const back = () => window.history.back();

  useEffect(() => {
    window.history.replaceState({ nav: navRef.current }, "");
    const onPop = (e) => {
      const s = (e.state && e.state.nav) || HOME_NAV;
      navRef.current = s;
      applyNav(s);
    };
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  // 세션 복원 + 계정에 저장된 결과 동기화.
  // 이게 끝나기 전에 화면을 그리면 로그인된 사용자에게도 로그인 화면이 한 번 번쩍인다.
  // 그래서 확인이 끝날 때까지는 스플래시를 유지하고(app-ready 이벤트로 알린다) 아무것도 그리지 않는다.
  useEffect(() => {
    api("GET", "/api/auth/me").then((d) => {
      if (d && d.user) {
        setUser(d.user);
        if (d.user.result && d.user.result.code) { setResult(d.user.result); LS.set("result", d.user.result); }
        // albamates.com/#admin 으로 관리자 화면에 바로 들어간다(관리자 계정일 때만).
        if (d.user.admin && window.location.hash === "#admin") go({ overlay: "admin" });
      }
      setAuthReady(true);
      window.dispatchEvent(new Event("app-ready"));
    });
  }, []);
  // 결제가 켜져 있는지·가격이 얼마인지는 서버가 정한다.
  useEffect(() => { api("GET", "/api/pay/config").then((d) => setPayCfg(d && d.ok ? d : { enabled: false })); }, []);

  // 결제창에서 돌아온 직후 — 서버가 /?pay=ok|fail 로 되돌려준다.
  // 결과만 알리고 주소는 즉시 정리한다(새로고침 때 또 뜨지 않도록).
  useEffect(() => {
    if (!authReady) return;
    const q = new URLSearchParams(window.location.search);
    const pay = q.get("pay");
    if (!pay) return;
    const reason = q.get("reason");
    window.history.replaceState({ nav: navRef.current }, "", window.location.pathname);
    if (pay === "ok") {
      alert("결제가 완료됐어요! 프리미엄 리포트가 열렸어요 🎉");
      // 구매 여부는 서버가 판단한다 — 프론트에서 켜지 않고 다시 물어본다.
      api("GET", "/api/auth/me").then((d) => { if (d && d.user) { setUser(d.user); go({ overlay: "result" }); } });
    } else {
      alert(reason || "결제가 완료되지 않았어요.");
    }
  }, [authReady]);

  const onAuthed = (u) => { setUser(u); if (u.result && u.result.code) { setResult(u.result); LS.set("result", u.result); } };
  // 로그아웃하면 다시 초기화면(로그인 게이트)으로 떨어진다. 앱 안의 상태도 비운다.
  const onLogout = () => { setUser(null); setResult(null); LS.set("result", null); go({ overlay: null, tab: "home" }); };

  const goTab = (k) => go({ overlay: null, tab: k });
  const goCat = (cat) => go({ overlay: null, tab: "types", typesCat: cat });
  const openGuide = (t, from) => go({ overlay: "detail", guide: t, detailFrom: from });
  const start = (prev) => go({ overlay: prev && result ? "result" : "quiz" });
  const done = (letters) => {
    const r = computeResult(letters); setResult(r); LS.set("result", r); go({ overlay: "result" });
    if (user) api("PUT", "/api/me/result", { result: r }).then((d) => { if (d && d.user) setUser(d.user); });
  };
  // 세션 확인 전에는 스플래시가 덮고 있다 — 아무것도 그리지 않는다.
  if (!authReady) return null;
  // 로그인해야 앱 안으로 들어올 수 있다.
  if (!user) return <div className="phone noscroll"><AuthGate onAuthed={onAuthed} /></div>;

  // 프리미엄 리포트 구매 여부. 결제가 꺼져 있으면(키 미설정) 전부 무료 — 잠그지 않는다.
  const payOn = !!(payCfg && payCfg.enabled);
  const reportPaid = !payOn || !!(user.entitlements && user.entitlements.premium_report);
  const reportPrice = payOn && payCfg.products && payCfg.products.premium_report
    ? payCfg.products.premium_report.amount : null;

  return (
    <div className="phone noscroll">
      {/* 몰입 화면(탭바 숨김) */}
      {overlay === "quiz" && <Quiz onDone={done} onBack={back} />}
      {overlay === "result" && result &&
        <Result result={result} onRetry={() => go({ overlay: "quiz" })} onGuide={(t) => openGuide(t, "result")} onHome={() => goTab("home")}
          paid={reportPaid} price={reportPrice} onBuy={() => startPayment("premium_report")} />}
      {overlay === "post" && postId && <PostDetail id={postId} onBack={back}
        onEdit={(p) => { setEditPost(p); go({ overlay: "write" }); }}
        onDeleted={() => { setFeedKey((k) => k + 1); goTab("community"); }}
        onChanged={() => setFeedKey((k) => k + 1)} />}
      {overlay === "write" && <PostWrite initial={editPost} onBack={back}
        onDone={(p) => { setEditPost(null); setPostId(p.id); setFeedKey((k) => k + 1); go({ overlay: "post" }); }} />}
      {overlay === "detail" && guide && <Guide target={guide} onBack={back} backLabel={detailFrom === "result" ? "‹ 결과로" : "‹ 목록으로"} />}
      {overlay === "account" && <AccountScreen user={user} onAuthed={onAuthed} onUser={setUser} onLogout={onLogout} onBack={back} onAdmin={() => go({ overlay: "admin" })} onRetake={() => go({ overlay: "quiz" })} onViewResult={() => go({ overlay: "result" })} paid={reportPaid} />}
      {overlay === "admin" && user.admin && <AdminScreen onBack={back} />}

      {/* 탭 콘텐츠 */}
      {!overlay && tab === "home" && <Home onGuide={(t) => openGuide(t, "home")} onMbti={() => goTab("mbti")} onNav={goTab} onCat={goCat} onCalc={() => goTab("calc")} onAccount={() => go({ overlay: "account" })} user={user} prev={result} paid={reportPaid} />}
      {!overlay && tab === "community" && <CommunityTab refreshKey={feedKey}
        onOpen={(id) => { setPostId(id); go({ overlay: "post" }); }}
        onWrite={() => { setEditPost(null); go({ overlay: "write" }); }} />}
      {!overlay && tab === "types" && <TypesTab onGuide={(t) => openGuide(t, "types")} initial={typesCat} />}
      {!overlay && tab === "guideList" && <GuideTab onGuide={(t) => openGuide(t, "guideList")} />}
      {!overlay && tab === "calc" && <Calc />}
      {!overlay && tab === "mbti" && <MbtiIntro onStart={start} prev={result} paid={reportPaid} />}
      {!overlay && tab === "faq" && <FaqTab />}

      {!overlay && <BottomNav tab={tab} onTab={goTab} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// 스플래시는 세션 확인(app-ready)이 끝나야 걷는다. 그 전에 걷으면 이미 로그인한
// 사용자에게도 로그인 화면이 한 번 번쩍인다. 최소 1.1초는 유지(깜빡임 방지 + 팁 읽을 시간),
// 네트워크가 죽어 app-ready 가 영영 안 오면 6초 뒤 강제로 걷는다.
(function () {
  let done = false;
  const hide = () => {
    if (done) return;
    done = true;
    const el = document.getElementById("splash");
    if (!el) return;
    const wait = Math.max(0, 1100 - performance.now());
    setTimeout(() => {
      el.classList.add("hide");
      setTimeout(() => el.remove(), 500);
    }, wait);
  };
  window.addEventListener("app-ready", hide);
  setTimeout(hide, 6000);
})();
</script>
<script>
  // 서비스워커 등록(설치형 PWA). HTTPS 또는 localhost에서만 동작.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
