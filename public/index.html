<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
/* ============================================================
   법정 최저임금 — 해가 바뀌면 MW_TABLE 에 한 줄만 추가하세요.
   from(KST) 이 지나면 앱 전체(가이드 문구·표·계산기·시급 배지)가 자동 전환돼요.
   2027년 10,700원: 최저임금위원회 2026-07-14 의결, 2027-01-01 시행.
   ============================================================ */
const MW_TABLE = [
  { year:2025, wage:10030, from:"2025-01-01" },
  { year:2026, wage:10320, from:"2026-01-01" },
  { year:2027, wage:10700, from:"2027-01-01" },
];
const MW_NOW = (() => { const t = Date.now(); let cur = MW_TABLE[0];
  for (const m of MW_TABLE) if (t >= Date.parse(m.from + "T00:00:00+09:00")) cur = m; return cur; })();
const MW_PREV = MW_TABLE[MW_TABLE.indexOf(MW_NOW) - 1] || null;
const MW_NEXT = MW_TABLE[MW_TABLE.indexOf(MW_NOW) + 1] || null;   // 이미 고시됐지만 아직 시행 전
const MW = MW_NOW.wage, MW_YEAR = MW_NOW.year;
const won = (n) => Math.round(n).toLocaleString() + "원";
const MW_NEXT_NOTE = MW_NEXT ? ` (${MW_NEXT.year}년 1월부터 ${won(MW_NEXT.wage)})` : "";
async function api(method, url, body) {
  const opt = { method, headers: {}, credentials: "same-origin" };
  if (body) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  try { const r = await fetch(url, opt); let d = {}; try { d = await r.json(); } catch (e) {} return { status: r.status, ...d }; }
  catch (e) { return { status: 0, ok: false, error: "네트워크 오류예요." }; }
}

/* ---------- 결제 (나이스페이) ----------
   서버에서 주문을 만들고(금액은 서버 상품표 기준) 그 값으로 결제창을 띄운다.
   결제창이 닫히면 브라우저는 서버의 returnUrl 로 갔다가 /?pay=ok|fail 로 되돌아온다. */
async function startPayment(product) {
  if (!window.AUTHNICE) { alert("결제 모듈을 불러오지 못했어요. 새로고침 후 다시 시도해 주세요."); return; }
  const d = await api("POST", "/api/pay/prepare", { product });
  if (!d.ok) { alert(d.error || "결제를 시작할 수 없어요."); return; }
  window.AUTHNICE.requestPay({
    clientId: d.clientId,
    method: "card",
    orderId: d.orderId,
    amount: d.amount,
    goodsName: d.goodsName,
    returnUrl: d.returnUrl,
    fnError: (r) => alert((r && (r.errorMsg || r.msg)) || "결제 중 오류가 발생했어요."),
  });
}

/* 시급 수준 3단계 — 최저임금 대비 배수로 색을 달리해 한눈에 구분되게.
   t0 최저임금 수준(~1.15배) · t1 평균 이상(1.15~1.45배) · t2 고시급(1.45배~)
   분포: 최저임금 수준 25종 / 평균 이상 13종 / 고시급 5종(과외·방과후·배달·골프캐디·이삿짐)
   ※ 초록(brand)=직종 배지, 빨강(red-50)="힘든 점"에 이미 쓰고 있어서
     고시급은 겹치지 않는 보라(violet) 채움 배지로 뺐다. */
const WAGE_TIERS = [
  { label:"최저임금 수준", badge:"text-gray-500 bg-gray-100",   card:"bg-gray-50",    num:"text-gray-700",   bar:"bg-gray-400",   pill:"text-gray-600 bg-gray-200" },
  { label:"평균 이상",     badge:"text-amber-700 bg-amber-50",  card:"bg-amber-50",   num:"text-amber-700",  bar:"bg-amber-400",  pill:"text-amber-800 bg-amber-100" },
  { label:"고시급",        badge:"text-white bg-violet-600",    card:"bg-violet-50",  num:"text-violet-700", bar:"bg-violet-500", pill:"text-white bg-violet-600" },
];
const wageTier = (ratio) => (ratio >= 1.45 ? WAGE_TIERS[2] : ratio >= 1.15 ? WAGE_TIERS[1] : WAGE_TIERS[0]);

const wageRound = (n) => Math.round(n / 100) * 100;
const wageWon = (n) => n.toLocaleString() + "원";
function typeWage(id) {
  const w = TYPE_WAGE[id];
  if (!w) return null;
  const lo = w.lo === 1 ? WAGE_BASE : wageRound(WAGE_BASE * w.lo);
  const hi = wageRound(WAGE_BASE * w.hi);
  const mid = Math.round((lo + hi) / 2);
  const ratio = mid / WAGE_BASE;
  return { lo, hi, mid, note: w.note, ratio, tier: wageTier(ratio),
           /* 최저임금(0%) ~ 최저임금 2배(100%) 구간에서의 위치 */
           pct: Math.max(2, Math.min(100, Math.round(((mid - WAGE_BASE) / WAGE_BASE) * 100))) };
}
/* 목록·카드용 시급 배지 (등급별 색) */
function WageBadge({ id, size }) {
  const w = typeWage(id);
  if (!w) return null;
  return (
    <span className={(size === "lg" ? "text-[11px]" : "text-[10px]") + " font-semibold px-1.5 py-0.5 rounded shrink-0 " + w.tier.badge}>
      💰 {w.lo.toLocaleString()}~{wageWon(w.hi)}
    </span>
  );
}

/* 시급 순위 — 중앙값 기준 내림차순, 동률은 같은 순위 */
const WAGE_RANK = (() => {
  const rows = Object.keys(TYPE_WAGE).map((id) => ({ id, m: (TYPE_WAGE[id].lo + TYPE_WAGE[id].hi) / 2 }))
    .sort((x, y) => y.m - x.m);
  const out = {};
  rows.forEach((r, i) => { out[r.id] = (i > 0 && rows[i - 1].m === r.m) ? out[rows[i - 1].id] : i + 1; });
  return out;
})();
const wageRank = (id) => WAGE_RANK[id];

/* 목록·카드용 짧은 표기 */
function wageShort(id) {
  const w = typeWage(id);
  return w ? w.lo.toLocaleString() + "~" + wageWon(w.hi) : null;
}

const TYPE_BY_ID = Object.fromEntries(TYPES.map((t) => [t.id, t]));
function relatedBasics(code) {
  const beginnerish = code[3] === "G";
  return beginnerish ? BASICS.filter((b) => ["contract","firstday","interview","wage"].includes(b.id))
                     : BASICS.filter((b) => ["contract","wage","weekly","safety"].includes(b.id));
}
// 응답(letter 배열) → { code, axisPct: [{a,b,lead,pct}] }
function computeResult(letters) {
  const axisPct = AXES.map(([A, B], i) => {
    const qs = QUIZ.map((q, idx) => ({ q, idx })).filter((x) => x.q.ax === i);
    const aCount = qs.filter((x) => letters[x.idx] === A).length;
    const total = qs.length;
    const lead = aCount >= total - aCount ? A : B;
    const pct = Math.round((Math.max(aCount, total - aCount) / total) * 100);
    return { a: A, b: B, aCount, total, lead, pct };
  });
  return { code: axisPct.map((x) => x.lead).join(""), axisPct };
}

function Quiz({ onDone, onBack }) {
  const [i, setI] = useState(0);
  const [letters, setLetters] = useState([]);
  const cur = QUIZ[i];
  const pick = (letter) => {
    const next = [...letters]; next[i] = letter; setLetters(next);
    if (i < QUIZ.length - 1) setTimeout(() => setI(i + 1), 140);
    else setTimeout(() => onDone(next), 140);
  };
  return (
    <div className="min-h-screen bg-white px-6 pt-14 pb-10 flex flex-col">
      <div className="flex items-center gap-3">
        <button onClick={() => (i === 0 ? onBack() : setI(i - 1))} className="text-gray-400 text-xl shrink-0">‹</button>
        <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
          <div className="h-full bg-brand transition-all rounded-full" style={{ width: `${((i + 1) / QUIZ.length) * 100}%` }} />
        </div>
        <span className="text-xs text-gray-400 font-semibold shrink-0">{i + 1}/{QUIZ.length}</span>
      </div>
      <div className="mt-14 flex-1" key={i}>
        <div className="rise">
          <div className="text-sm font-bold text-brand">Q{i + 1}</div>
          <h2 className="text-2xl font-bold text-gray-900 mt-2 leading-snug">{cur.q}</h2>
          <div className="mt-9 space-y-3">
            {[cur.a, cur.b].map(([letter, label]) => (
              <button key={letter} onClick={() => pick(letter)}
                className="w-full text-left px-5 py-4 rounded-2xl text-[15px] font-semibold text-gray-700 border border-gray-200 bg-white transition active:border-brand active:bg-brandLt press">
                {label}

  );
}

/* ============================================================
   결과 공유 카드 — 인스타 스토리 규격(1080×1920) 이미지를 canvas 로 그린다.
   서버를 거치지 않으니 비용도 지연도 없다. 이미지가 있어야 결과가 퍼진다.
   ============================================================ */
const CARD_W = 1080, CARD_H = 1920;
const cardFont = (weight, size) =>
  `${weight} ${size}px Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif`;

function roundRectPath(g, x, y, w, h, r) {
  if (g.roundRect) { g.beginPath(); g.roundRect(x, y, w, h, r); return; }
  g.beginPath();                       // roundRect 없는 구형 브라우저용 수동 경로
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

async function buildShareCard({ code, p, axisPct }) {
  const cv = document.createElement("canvas");
  cv.width = CARD_W; cv.height = CARD_H;
  const g = cv.getContext("2d");
  // 웹폰트(Pretendard)가 준비되기 전에 그리면 시스템 기본 폰트로 찍힌다.
  try { await document.fonts.ready; } catch (e) {}

  const grad = g.createLinearGradient(0, 0, CARD_W * 0.4, CARD_H);
  grad.addColorStop(0, "#22C063");
  grad.addColorStop(0.55, "#1BB055");
  grad.addColorStop(1, "#138640");
  g.fillStyle = grad;
  g.fillRect(0, 0, CARD_W, CARD_H);

  const glow = g.createRadialGradient(CARD_W / 2, 420, 60, CARD_W / 2, 420, 620);
  glow.addColorStop(0, "rgba(255,255,255,.16)");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = glow;
  g.fillRect(0, 0, CARD_W, 1100);

  g.textAlign = "center";

  g.fillStyle = "rgba(255,255,255,.82)";
  g.font = cardFont(700, 42);
  g.fillText("알바 MBTI", CARD_W / 2, 175);

  g.font = cardFont(400, 200);
  g.fillText(p.emoji, CARD_W / 2, 420);

  g.fillStyle = "#fff";
  g.font = cardFont(800, 150);
  try { g.letterSpacing = "14px"; } catch (e) {}
  g.fillText(code, CARD_W / 2, 600);
  try { g.letterSpacing = "0px"; } catch (e) {}

  g.font = cardFont(800, 76);
  g.fillText(p.nick, CARD_W / 2, 712);

  g.fillStyle = "rgba(255,255,255,.8)";
  g.font = cardFont(500, 40);
  g.fillText(p.tag, CARD_W / 2, 782);

  // ── 성향 4축 카드 ──
  const CX = 90, CY = 860, CW = CARD_W - 180, CH = 610;
  g.fillStyle = "#fff";
  roundRectPath(g, CX, CY, CW, CH, 52);
  g.fill();

  const rowTop = CY + 78, rowGap = 138, barW = CW - 130, barX = CX + 65;
  axisPct.forEach((x, i) => {
    const y = rowTop + i * rowGap;
    const leftActive = x.lead === x.a;
    g.textAlign = "left";
    g.font = cardFont(700, 34);
    g.fillStyle = leftActive ? "#1BB055" : "#C9CDD2";
    g.fillText(`${x.a} ${AXIS_LABEL[x.a]}`, barX, y);
    g.textAlign = "right";
    g.fillStyle = leftActive ? "#C9CDD2" : "#1BB055";
    g.fillText(`${AXIS_LABEL[x.b]} ${x.b}`, barX + barW, y);

    const by = y + 26, bh = 26;
    g.fillStyle = "#F1F3F5";
    roundRectPath(g, barX, by, barW, bh, bh / 2);
    g.fill();
    const fw = Math.max(bh, (barW * x.pct) / 100);
    g.fillStyle = "#1BB055";
    roundRectPath(g, leftActive ? barX : barX + barW - fw, by, fw, bh, bh / 2);
    g.fill();
  });

  // ── 강점 칩 ──
  g.textAlign = "center";
  const chips = (p.strengths || []).slice(0, 2);
  if (chips.length) {
    g.font = cardFont(700, 38);
    const pad = 34, gap = 20;
    const widths = chips.map((s) => g.measureText("💪 " + s).width + pad * 2);
    let x = (CARD_W - (widths.reduce((a, b) => a + b, 0) + gap * (chips.length - 1))) / 2;
    chips.forEach((s, i) => {
      g.fillStyle = "rgba(255,255,255,.2)";
      roundRectPath(g, x, CY + CH + 60, widths[i], 84, 42);
      g.fill();
      g.fillStyle = "#fff";
      g.fillText("💪 " + s, x + widths[i] / 2, CY + CH + 115);
      x += widths[i] + gap;
    });
  }

  g.fillStyle = "rgba(255,255,255,.75)";
  g.font = cardFont(500, 38);
  g.fillText("28문항으로 찾는 나에게 맞는 알바", CARD_W / 2, CARD_H - 150);
  g.fillStyle = "#fff";
  g.font = cardFont(800, 46);
  g.fillText("albamates.com", CARD_W / 2, CARD_H - 88);

  return cv;
}

/* 모바일은 공유 시트로, 안 되면 파일로 내려받는다. */
async function shareCardImage(cv, code, nick) {
  const blob = await new Promise((res) => cv.toBlob(res, "image/png"));
  if (!blob) throw new Error("toBlob 실패");
  const name = `알바MBTI_${code}.png`;
  const text = `내 알바 MBTI는 ${code} ${nick}!\nalbamates.com`;
  if (navigator.canShare) {
    try {
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text });
        return "shared";
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "cancel";   // 사용자가 공유 시트를 닫은 것
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return "downloaded";
}

function ShareButtons({ code, p, axisPct, shareText, onRetry, onHome }) {
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  async function onCard() {
    setBusy(true); setMsg("");
    try {
      const cv = await buildShareCard({ code, p, axisPct });
      const how = await shareCardImage(cv, code, p.nick);
      if (how === "downloaded") setMsg("이미지를 저장했어요! 인스타 스토리에 올려보세요 📸");
    } catch (e) {

    setBusy(false);

    catch (e) { alert(shareText); }

  return (

/* 대화 스크립트(대본) */
function PmScript({ items }) {
  const [copied, setCopied] = useState(-1);
  const copy = (t, i) => {
    const done = () => { setCopied(i); setTimeout(() => setCopied(-1), 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(() => {});
    else done();
  };
  return (
    <div className="space-y-3">
      {items.map((s, i) => (
        <div key={i} className="rounded-2xl border border-gray-100 bg-white overflow-hidden">
          <div className="px-4 py-2.5 bg-gray-50 flex items-center justify-between gap-2">
            <span className="text-[12.5px] font-extrabold text-gray-700">{s.sit}</span>
            <button onClick={() => copy(s.say, i)} className="shrink-0 text-[11px] font-bold text-brand bg-white border border-green-100 px-2 py-1 rounded-lg press">
              {copied === i ? "복사됨 ✓" : "복사"}
            </button>
          </div>
          <div className="px-4 py-3.5">
            <div className="relative bg-brand text-white text-[14px] leading-relaxed rounded-2xl rounded-tl-md px-3.5 py-3">
              {s.say}
            </div>
            {s.tip && (
              <p className="text-[12.5px] text-gray-500 mt-2.5 leading-relaxed flex gap-1.5">
                <span className="shrink-0">💡</span><span>{s.tip}</span>
              </p>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

/* 체크리스트(직접 체크) */
function PmCheck({ items, done }) {
  const [on, setOn] = useState([]);
  const toggle = (i) => setOn((p) => (p.includes(i) ? p.filter((x) => x !== i) : p.concat(i)));
  const all = on.length === items.length;
  return (
    <div>
      <div className="space-y-2">
        {items.map((it, i) => {
          const checked = on.includes(i);
          return (
            <button key={i} onClick={() => toggle(i)} className={"w-full flex items-start gap-2.5 text-left rounded-2xl px-3.5 py-3 border press transition " + (checked ? "bg-brandLt border-green-100" : "bg-white border-gray-100")}>
              <span className={"shrink-0 w-5 h-5 rounded-md grid place-items-center text-[11px] font-bold mt-0.5 " + (checked ? "bg-brand text-white" : "bg-gray-100 text-transparent")}>✓</span>
              <span className={"text-[14px] leading-relaxed " + (checked ? "text-gray-900 font-semibold" : "text-gray-600")}>{it}</span>
            </button>
          );
        })}
      </div>
      <div className="mt-2.5 flex items-center gap-2">
        <div className="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
          <div className="h-full bg-brand transition-all" style={{ width: (items.length ? (on.length / items.length) * 100 : 0) + "%" }} />
        </div>
        <span className="text-[12px] font-bold text-gray-400">{on.length}/{items.length}</span>
      </div>
      {all && done && <div className="mt-2.5 rounded-2xl bg-brandLt px-4 py-3 text-[13.5px] font-bold text-brand leading-relaxed pop">🎉 {done}</div>}
    </div>
  );
}

/* ---------- 인터랙티브 계산기 ---------- */
function PmCalcRow({ label, value, set, unit, step = 1, min = 0 }) {
  return (
    <label className="flex items-center gap-2 py-2">
      <span className="w-[104px] shrink-0 text-[13px] font-bold text-gray-600">{label}</span>
      <input type="number" inputMode="numeric" value={value} min={min} step={step}
        onChange={(e) => set(e.target.value === "" ? "" : Number(e.target.value))}
        className="flex-1 min-w-0 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 text-[15px] font-bold text-gray-900 text-right focus:outline-none focus:border-brand" />
      <span className="shrink-0 text-[13px] text-gray-400 w-8">{unit}</span>
    </label>
  );
}
function PmCalcResult({ label, value, sub }) {
  return (
    <div className="mt-3 rounded-2xl bg-brand text-white px-4 py-4 text-center">
      <div className="text-[12px] font-bold text-white/80">{label}</div>
      <div className="text-[26px] font-extrabold mt-0.5 tracking-tight">{value}</div>
      {sub && <div className="text-[12px] text-white/80 mt-1 leading-relaxed">{sub}</div>}
    </div>
  );
}
function PmCalc({ kind }) {
  /* 주휴수당 */
  const [wage, setWage] = useState(PM_WAGE);
  const [hours, setHours] = useState(20);
  /* 퇴직금 */
  const [monthly, setMonthly] = useState(1600000);
  const [months, setMonths] = useState(12);
  /* 3.3% 환급 */
  const [income, setIncome] = useState(6000000);

  if (kind === "weekly") {
    const w = Number(wage) || 0, h = Number(hours) || 0;
    const pay = (Math.min(h, 40) / 40) * 8 * w;
    const ok = h >= 15;
    return (
      <div className="rounded-2xl border border-gray-100 bg-white p-4">
        <div className="text-[13px] font-extrabold text-gray-900 mb-1">🧮 주휴수당 계산기</div>
        <PmCalcRow label="시급" value={wage} set={setWage} unit="원" step={10} />
        <PmCalcRow label="주 소정근로시간" value={hours} set={setHours} unit="h" />
        {ok ? (
          <PmCalcResult label="주휴수당 (1주)" value={pmWon(pay)}
            sub={`(${Math.min(h, 40)} ÷ 40) × 8 × ${Number(w).toLocaleString()}원 · 월 환산 약 ${pmWon(pay * 4.345)}`} />
        ) : (
          <div className="mt-3 rounded-2xl bg-red-50 px-4 py-4 text-center">
            <div className="text-[13px] font-bold text-red-500 leading-relaxed">주 15시간 미만이라 주휴수당 대상이 아니에요.</div>
            <div className="text-[12px] text-gray-500 mt-1">근무시간을 15시간 이상으로 조정할 수 있는지 사장님과 상의해보세요.</div>
          </div>
        )}
      </div>
    );
  }

  if (kind === "severance") {
    const m = Number(monthly) || 0, mo = Number(months) || 0;
    const days = Math.round(mo * 30.4);
    const daily = (m * 3) / 91.25;
    const pay = daily * 30 * (days / 365);
    const ok = mo >= 12;
    return (
      <div className="rounded-2xl border border-gray-100 bg-white p-4">
        <div className="text-[13px] font-extrabold text-gray-900 mb-1">🧮 퇴직금 계산기</div>
        <PmCalcRow label="월 평균급여" value={monthly} set={setMonthly} unit="원" step={10000} />
        <PmCalcRow label="재직 기간" value={months} set={setMonths} unit="개월" />
        {ok ? (
          <PmCalcResult label="예상 퇴직금" value={pmWon(pay)}
            sub={`1일 평균임금 ${pmWon(daily)} × 30일 × (${days}일 ÷ 365)`} />
        ) : (
          <div className="mt-3 rounded-2xl bg-red-50 px-4 py-4 text-center">
            <div className="text-[13px] font-bold text-red-500 leading-relaxed">1년(12개월) 미만이라 아직 퇴직금 대상이 아니에요.</div>
            <div className="text-[12px] text-gray-500 mt-1">{12 - mo}개월만 더 채우면 대상이 됩니다.</div>
          </div>
        )}
        <p className="text-[11px] text-gray-400 mt-2.5 leading-relaxed">※ 최근 3개월 급여를 기준으로 한 추정치예요. 상여·수당이 있으면 실제 금액은 더 올라갈 수 있어요.</p>
      </div>
    );
  }

  /* 3.3% 환급 (추정) */
  const r = Number(income) || 0;
  const paid = r * 0.033;                                   // 이미 뗀 세금
  const base = Math.max(0, r - r * 0.641 - 1500000);        // 단순경비율(64.1%) + 기본공제 150만 가정
  const tax = Math.max(0, base * 0.06 - 70000);             // 6% 세율 - 표준세액공제
  const refund = Math.max(0, paid - tax);
  return (
    <div className="rounded-2xl border border-gray-100 bg-white p-4">
      <div className="text-[13px] font-extrabold text-gray-900 mb-1">🧮 3.3% 환급 계산기</div>
      <PmCalcRow label="1년 알바 총수입" value={income} set={setIncome} unit="원" step={100000} />
      <PmCalcResult label="예상 환급액" value={pmWon(refund)}
        sub={`이미 뗀 세금 ${pmWon(paid)} − 실제 낼 세금 약 ${pmWon(tax)}`} />
      <p className="text-[11px] text-gray-400 mt-2.5 leading-relaxed">※ 단순경비율과 기본공제만 반영한 추정치예요. 다른 소득·공제에 따라 달라지니 홈택스에서 최종 확인하세요.</p>
    </div>
  );
}

/* 블록 디스패처 */
function PmBlock({ b }) {
  switch (b.t) {
    case "p":        return <p className="text-[15px] text-gray-700 leading-[1.8]">{b.text}</p>;
    case "points":   return (
      <ul className="space-y-2.5">
        {b.items.map((p, j) => (
          <li key={j} className="flex gap-2.5 text-[15px] text-gray-700 leading-relaxed items-start">
            <span className="w-5 h-5 bg-brand text-white rounded-full grid place-items-center text-[11px] shrink-0 mt-0.5">✓</span>{p}
          </li>
        ))}
      </ul>
    );
    case "check":    return <PmCheck items={b.items} done={b.done} />;
    case "stats":    return <PmStats items={b.items} />;
    case "table":    return <PmTable head={b.head} rows={b.rows} note={b.note} />;
    case "compare":  return <PmCompare head={b.head} rows={b.rows} />;
    case "ox":       return <PmOX items={b.items} />;
    case "steps":    return <PmSteps items={b.items} />;
    case "faq":      return <PmFaq items={b.items} />;
    case "law":      return <PmLaw article={b.article} text={b.text} />;
    case "warn":     return <PmCallout kind="warn" title={b.title} text={b.text} />;
    case "tip":      return <PmCallout kind="tip" title={b.title} text={b.text} />;
    case "cards":    return <PmCards items={b.items} />;
    case "script":   return <PmScript items={b.items} />;
    case "contacts": return <PmContacts items={b.items} />;
    case "calc":     return <PmCalc kind={b.kind} />;
    default:         return null;
  }
}

/* 프리미엄 가이드 본문 — 목차 + 섹션별 블록 렌더 */
function PremiumArticle({ pm, onBack, label }) {
  const [prog, setProg] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const el = document.documentElement;
      const max = el.scrollHeight - el.clientHeight;
      setProg(max > 0 ? Math.min(100, (el.scrollTop / max) * 100) : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, [pm.id]);

  const jump = (i) => {
    const el = document.getElementById(pm.id + "-s" + i);
    if (el) window.scrollTo({ top: el.offsetTop - 56, behavior: "smooth" });
  };

  return (
    <div className="pb-16 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label={label} />
      <div className="sticky top-12 z-10 h-1 bg-gray-100">
        <div className="h-full bg-brand transition-all" style={{ width: prog + "%" }} />
      </div>

      {/* 헤더 */}
      <div className="bg-white px-5 pt-5 pb-6">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-3xl">{pm.emoji}</span>
          <span className="text-xs font-bold text-white bg-brand px-2 py-1 rounded-full">👑 프리미엄 · {pm.cat}</span>
          {pm.read && <span className="text-xs font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded-full">🕐 {pm.read}</span>}
        </div>
        <h1 className="text-[26px] font-bold text-gray-900 mt-3 leading-tight">{pm.title}</h1>
        <p className="text-gray-500 mt-2 leading-relaxed">{pm.sub}</p>
      </div>

      {/* 목차 */}
      <div className="bg-white mt-2 px-5 py-4">
        <div className="text-[12px] font-extrabold text-gray-400 mb-2.5">목차</div>
        <div className="space-y-1.5">
          {pm.sections.map((s, i) => (
            <button key={i} onClick={() => jump(i)} className="w-full flex items-center gap-2.5 text-left press">
              <span className="shrink-0 w-5 h-5 rounded-md bg-gray-50 text-gray-400 grid place-items-center text-[11px] font-bold">{i + 1}</span>
              <span className="flex-1 text-[14px] font-semibold text-gray-700 truncate">{s.h}</span>
              <span className="shrink-0 text-gray-300 text-[12px]">›</span>
            </button>
          ))}
        </div>
      </div>

      {/* 본문 */}
      {pm.sections.map((s, i) => (
        <div key={i} id={pm.id + "-s" + i} className="bg-white px-5 py-6 mt-2 scroll-mt-16">
          <div className="flex items-baseline gap-2">
            <span className="text-[13px] font-extrabold text-brand">{String(i + 1).padStart(2, "0")}</span>
            <h2 className="text-[19px] font-bold text-gray-900 leading-snug">{s.h}</h2>
          </div>
          {s.sub && <p className="text-[13.5px] text-gray-500 mt-1.5 leading-relaxed">{s.sub}</p>}
          <div className="mt-4 space-y-4">
            {(s.blocks || []).map((b, j) => <PmBlock key={j} b={b} />)}
          </div>
        </div>
      ))}

      <div className="px-5 mt-5">
        <button onClick={onBack} className="w-full bg-white border border-gray-200 text-gray-600 font-bold py-3.5 rounded-xl press">‹ 가이드 목록으로</button>
      </div>
      <div className="px-5 mt-4 text-[11px] text-gray-400 leading-relaxed">
        ※ {MW_YEAR}년 기준으로 정리한 내용이에요. 법령·금액은 바뀔 수 있고, 구체적인 사안은 고용노동부(1350)나 청소년·청년근로권익센터(1644-3119)에 상담받는 걸 권해요.
      </div>
    </div>
  );
}

function Section({ title, children }) {
  return <div className="px-5 mt-6">{title && <h2 className="text-lg font-bold text-gray-900 mb-3">{title}</h2>}{children}</div>;
}
function TopBar({ onBack, label }) {
  return (
    <div className="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-gray-100 h-12 flex items-center px-3">
      <button onClick={onBack} className="flex items-center text-gray-700 text-[15px] font-semibold px-1"><span className="text-xl mr-0.5">‹</span>{label}</button>
    </div>
  );
}
/* ============================================================
   우리 동네에서 일할 곳 — 카카오 로컬 API
   "편의점 알바"를 보고 있으면 내 위치 반경의 편의점을 뽑아 지도·목록으로 보여준다.
   솔직하게: 이건 "근처에 있는 매장"이지 "지금 알바를 뽑는 매장"이 아니다.
   공고 데이터는 공개 API가 없어서, 대신 전화번호와 공고 검색 링크를 같이 준다.
   ============================================================ */
let placesCfgPromise = null;
function loadPlacesConfig() {
  if (!placesCfgPromise) placesCfgPromise = api("GET", "/api/places/config");
  return placesCfgPromise;
}
/* 지도 SDK는 실제로 지도를 볼 때 처음 받는다(첫 화면 로딩을 늦추지 않는다). */
let kakaoSdkPromise = null;
function loadKakaoSdk(jsKey) {
  if (kakaoSdkPromise) return kakaoSdkPromise;
  kakaoSdkPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    // autoload=false + kakao.maps.load() — 이걸 빼면 onload 시점에 kakao.maps 가 아직 undefined 다.
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${jsKey}&autoload=false`;
    s.onload = () => window.kakao.maps.load(() => resolve(window.kakao));
    s.onerror = () => reject(new Error("지도를 불러오지 못했어요."));
    document.head.appendChild(s);
  });
  return kakaoSdkPromise;
}
const placeDist = (m) => (m >= 1000 ? (m / 1000).toFixed(1) + "km" : m + "m");
/* 공고 검색 딥링크 — 사이트 URL 형식이 바뀌면 여기만 고치면 돼요. */
const jobSearchLinks = (regionText, typeName) => {
  const q = encodeURIComponent([regionText, typeName].filter(Boolean).join(" "));
  return [
    { label: "알바몬", url: `https://www.albamon.com/jobs/search?keyword=${q}` },
    { label: "알바천국", url: `https://www.alba.co.kr/search/Search.asp?hidSearchWord=${q}` },
  ];
};

/* 마커 클릭 → 말풍선으로 매장 정보. 목록 ↔ 지도 양방향으로 연동된다.
   CustomOverlay 의 content 를 문자열이 아닌 DOM 으로 넘겨야 클릭 이벤트를 붙일 수 있고,
   clickable:true 가 없으면 클릭이 지도로 새어나가 오버레이가 이벤트를 못 받는다. */
const PIN_BASE = "color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;padding:0 5px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;transition:transform .12s";

function buildInfoEl(p, onClose) {
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:relative;min-width:180px;max-width:250px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.22);padding:11px 12px 10px;font-family:inherit";
  const tail = document.createElement("div");
  tail.style.cssText = "position:absolute;left:50%;bottom:-7px;margin-left:-7px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fff";
  const close = document.createElement("button");
  close.textContent = "×";
  close.setAttribute("aria-label", "닫기");
  close.style.cssText = "position:absolute;top:4px;right:6px;border:0;background:none;font-size:17px;line-height:1;color:#9ca3af;cursor:pointer;padding:2px";
  close.onclick = (e) => { e.stopPropagation(); onClose(); };

  const name = document.createElement("div");
  name.textContent = p.name;
  name.style.cssText = "font-size:14px;font-weight:700;color:#111827;padding-right:16px;line-height:1.3";

  const meta = document.createElement("div");
  meta.textContent = [p.category, placeDist(p.distance)].filter(Boolean).join(" · ");
  meta.style.cssText = "font-size:11px;color:#16a34a;font-weight:600;margin-top:3px";

  const addr = document.createElement("div");
  addr.textContent = p.address;
  addr.style.cssText = "font-size:11px;color:#6b7280;margin-top:4px;line-height:1.4";

  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:6px;margin-top:8px";
  const mk = (label, href) => {
    const a = document.createElement("a");
    a.textContent = label;
    a.href = href;
    if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.style.cssText = "flex:1;text-align:center;font-size:12px;font-weight:600;color:#374151;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:6px 4px;text-decoration:none";
    a.onclick = (e) => e.stopPropagation();
    return a;
  };
  if (p.phone) btns.appendChild(mk("📞 전화", "tel:" + p.phone));
  if (p.url) btns.appendChild(mk("카카오맵 ↗", p.url));

  wrap.append(close, name, meta, addr);
  if (btns.childNodes.length) wrap.appendChild(btns);
  wrap.appendChild(tail);
  return wrap;
}

function PlacesMap({ center, places, focus, onPick, sdk }) {
  const box = useRef(null);
  const mapRef = useRef(null);
  const marksRef = useRef([]);    // { ov, el }
  const infoRef = useRef(null);   // 말풍선 하나를 재사용한다
  const pickRef = useRef(onPick); // 지도 리스너는 한 번만 붙으므로 최신 콜백을 ref 로 본다
  pickRef.current = onPick;

  useEffect(() => {
    if (!sdk || !box.current) return;
    const kakao = sdk;
    if (!mapRef.current) {
      mapRef.current = new kakao.maps.Map(box.current, {
        center: new kakao.maps.LatLng(center.lat, center.lng), level: 5,
      });
      new kakao.maps.CustomOverlay({   // 내 위치 — 파란 점
        map: mapRef.current, zIndex: 1,
        position: new kakao.maps.LatLng(center.lat, center.lng),
        content: '<div style="width:14px;height:14px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.3)"></div>',
      });
      // 빈 곳을 누르면 말풍선을 닫는다.
      kakao.maps.event.addListener(mapRef.current, "click", () => pickRef.current(null));
    }
    marksRef.current.forEach((m) => m.ov.setMap(null));
    marksRef.current = places.map((p, i) => {
      const el = document.createElement("div");
      el.style.cssText = PIN_BASE + ";background:#16a34a";
      el.textContent = String(i + 1);
      el.onclick = () => pickRef.current(i);
      const ov = new kakao.maps.CustomOverlay({
        map: mapRef.current, zIndex: 2, yAnchor: 1.2, clickable: true,
        position: new kakao.maps.LatLng(p.lat, p.lng), content: el,
      });
      return { ov, el };
    });
    if (places.length) {
      const b = new kakao.maps.LatLngBounds();
      b.extend(new kakao.maps.LatLng(center.lat, center.lng));
      places.forEach((p) => b.extend(new kakao.maps.LatLng(p.lat, p.lng)));
      mapRef.current.setBounds(b);
    }
  }, [sdk, places, center]);

  // 선택이 바뀌면 마커를 강조하고 말풍선을 옮긴다(목록 클릭·마커 클릭 모두 여기로 모인다).
  useEffect(() => {
    if (!sdk || !mapRef.current) return;
    const kakao = sdk;
    marksRef.current.forEach((m, i) => {
      const on = i === focus;
      m.el.style.background = on ? "#111827" : "#16a34a";
      m.el.style.transform = on ? "scale(1.3)" : "scale(1)";
      m.ov.setZIndex(on ? 4 : 2);
    });
    if (!infoRef.current) infoRef.current = new kakao.maps.CustomOverlay({ yAnchor: 1.55, zIndex: 6, clickable: true });
    const info = infoRef.current;
    const p = focus == null ? null : places[focus];
    if (!p) { info.setMap(null); return; }
    info.setContent(buildInfoEl(p, () => pickRef.current(null)));
    info.setPosition(new kakao.maps.LatLng(p.lat, p.lng));
    info.setMap(mapRef.current);
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    const proj = mapRef.current.getProjection();
    if (proj) {
      const pt = proj.pointFromCoords(pos);
      pt.y -= 58;                       // 화면상 마커를 아래로 — 말풍선이 위로 펼쳐지므로
      mapRef.current.panTo(proj.coordsFromPoint(pt));
    } else {
      mapRef.current.panTo(pos);
    }
  }, [focus, places, sdk]);

  return <div ref={box} className="w-full h-72 rounded-2xl overflow-hidden border border-gray-200 bg-gray-100" />;
}

function NearbyPlaces({ t }) {
  const [cfg, setCfg] = useState(null);
  const [stage, setStage] = useState("idle");   // idle | locating | loading | done
  const [err, setErr] = useState("");
  const [center, setCenter] = useState(null);
  const [region, setRegion] = useState(null);
  const [places, setPlaces] = useState([]);
  const [radius, setRadius] = useState(1000);
  const [focus, setFocus] = useState(null);
  const [sdk, setSdk] = useState(null);
  const [mapErr, setMapErr] = useState(false);   // 지도만 실패 — 목록은 그대로 쓸 수 있다
  const listRef = useRef(null);

  /* 마커를 누르면 말풍선이 정보를 보여주고 목록 카드도 같이 강조된다.
     여기서 페이지를 스크롤하지는 않는다 — 방금 누른 지도가 화면 밖으로 밀려나기 때문. */
  function pick(i) { setFocus(i); }

  useEffect(() => { loadPlacesConfig().then(setCfg); }, []);

  useEffect(() => {
    if (!center) return;
    let alive = true;
    setStage("loading"); setErr("");
    Promise.all([
      api("GET", `/api/places?type=${t.id}&lat=${center.lat}&lng=${center.lng}&radius=${radius}`),
      api("GET", `/api/places/region?lat=${center.lat}&lng=${center.lng}`),
    ]).then(([p, r]) => {
      if (!alive) return;
      if (!p.ok) { setErr(p.error || "주변 정보를 가져오지 못했어요."); setStage("idle"); return; }
      setPlaces(p.places || []); setRegion(r && r.ok ? r : null); setFocus(null); setStage("done");
    });
    return () => { alive = false; };
  }, [center, radius, t.id]);

  useEffect(() => {
    if (stage !== "done" || !cfg || !cfg.jsKey || sdk) return;
    // 지도가 안 떠도(도메인 미등록 등) 목록·전화번호는 멀쩡하다 — 전체 오류로 취급하지 않는다.
    loadKakaoSdk(cfg.jsKey).then(setSdk).catch(() => setMapErr(true));
  }, [stage, cfg]);

  function locate() {
    if (!navigator.geolocation) { setErr("이 브라우저는 위치 기능을 지원하지 않아요."); return; }
    setStage("locating"); setErr("");
    navigator.geolocation.getCurrentPosition(
      (pos) => setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      (e) => {
        setStage("idle");
        setErr(e.code === 1
          ? "위치 권한이 거부됐어요. 주소창 왼쪽 자물쇠 아이콘에서 위치를 허용해 주세요."
          : "위치를 확인하지 못했어요. 잠시 후 다시 시도해 주세요.");
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
    );
  }

  if (!cfg || !cfg.enabled) return null;
  const regionText = region ? region.full : "";
  const links = jobSearchLinks(regionText, t.name);

  // 지도에 찍을 매장이 없는 유형(배달·재택·행사 등) — 솔직하게 공고 쪽으로 보낸다.
  if (!cfg.types.includes(t.id)) {
    return (
      <div className="bg-white px-5 py-5 mt-2">
        <h2 className="text-lg font-bold text-gray-900 mb-2">📍 우리 동네에서 찾기</h2>
        <p className="text-[14px] text-gray-600 leading-relaxed bg-gray-50 rounded-xl p-3.5">
          {t.name}는 매장을 찾아가기보다 <b>앱·공고로 지원</b>하는 알바예요. 아래에서 지역 공고를 바로 검색해 보세요.
        </p>
        <div className="flex gap-2 mt-3">
          {links.map((l, i) => (
            <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
              className="flex-1 text-center text-[14px] font-semibold text-gray-700 bg-gray-50 border border-gray-200 rounded-xl py-2.5">
              {l.label} 공고 ↗
            </a>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="bg-white px-5 py-5 mt-2">
      <h2 className="text-lg font-bold text-gray-900">📍 우리 동네 {t.name.replace(" 알바", "")}</h2>
      <p className="text-[12px] text-gray-400 mt-1">내 위치 주변에 어떤 곳이 있는지 먼저 확인해 보세요.</p>

      {stage === "idle" && (
        <button onClick={locate}
          className="w-full mt-3 bg-brand text-white font-bold text-[15px] rounded-2xl py-3.5 active:scale-[.99] transition">
          📍 내 주변에서 찾기
        </button>
      )}
      {(stage === "locating" || stage === "loading") && (
        <div className="mt-3 text-center text-[14px] text-gray-500 bg-gray-50 rounded-2xl py-4">
          {stage === "locating" ? "위치를 확인하는 중…" : "주변을 찾는 중…"}
        </div>
      )}
      {err && <p className="mt-3 text-[13px] text-red-600 bg-red-50 rounded-xl p-3 leading-relaxed">{err}</p>}

      {stage === "done" && (
        <div className="mt-3 space-y-3">
          <div className="flex items-center justify-between">
            <div className="text-[13px] text-gray-500">
              {regionText && <b className="text-gray-900">{regionText}</b>} 반경 {placeDist(radius)} · {places.length}곳
            </div>
            <div className="flex gap-1">
              {[500, 1000, 3000].map((r) => (
                <button key={r} onClick={() => setRadius(r)}
                  className={"text-[12px] font-semibold px-2.5 py-1 rounded-full border " +
                    (radius === r ? "bg-brand text-white border-brand" : "bg-white text-gray-500 border-gray-200")}>
                  {placeDist(r)}
                </button>
              ))}
            </div>
          </div>

          {cfg.jsKey && !mapErr && <PlacesMap center={center} places={places} focus={focus} onPick={pick} sdk={sdk} />}
          {mapErr && (
            <p className="text-[12px] text-gray-400 bg-gray-50 rounded-xl p-3 text-center">
              지도는 불러오지 못했어요. 목록으로 확인해 주세요.
            </p>
          )}

          {places.length === 0 && (
            <p className="text-[14px] text-gray-500 bg-gray-50 rounded-xl p-4 text-center">
              이 반경엔 결과가 없어요. 범위를 넓혀 보세요.
            </p>
          )}

          <ul ref={listRef} className="space-y-2">
            {places.map((p, i) => (
              <li key={p.id} data-idx={i} onClick={() => setFocus(focus === i ? null : i)}
                className={"rounded-2xl p-3.5 border cursor-pointer transition " +
                  (focus === i ? "border-brand bg-brandLt" : "border-gray-200 bg-white")}>
                <div className="flex items-start gap-2.5">
                  <span className="w-5 h-5 shrink-0 mt-0.5 rounded-full bg-brand text-white text-[11px] font-bold grid place-items-center">{i + 1}</span>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-baseline gap-2">
                      <span className="text-[15px] font-bold text-gray-900 truncate">{p.name}</span>
                      <span className="text-[12px] font-semibold text-brand shrink-0">{placeDist(p.distance)}</span>
                    </div>
                    <div className="text-[12px] text-gray-500 mt-0.5 truncate">{p.address}</div>
                    <div className="flex gap-2 mt-2">
                      {p.phone && (
                        <a href={`tel:${p.phone}`} onClick={(e) => e.stopPropagation()}
                          className="text-[13px] font-semibold text-gray-700 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5">
                          📞 {p.phone}
                        </a>
                      )}
                      {p.url && (
                        <a href={p.url} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()}
                          className="text-[13px] font-semibold text-gray-700 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5">
                          지도 ↗
                        </a>
                      )}
                    </div>
                  </div>
                </div>
              </li>
            ))}
          </ul>

          <div className="bg-amber-50 rounded-xl p-3.5 text-[13px] text-amber-800 leading-relaxed flex gap-2">
            <span className="shrink-0">⚠️</span>
            <span>여기 나온 곳이 <b>지금 알바를 뽑고 있다는 뜻은 아니에요.</b> 채용 여부는 공고를 확인하거나 매장에 직접 물어봐야 해요. 전화 문의는 한가한 시간대(오후 2~4시)가 좋아요.</span>
          </div>
          <div className="flex gap-2">
            {links.map((l, i) => (
              <a key={i} href={l.url} target="_blank" rel="noopener noreferrer"
                className="flex-1 text-center text-[14px] font-semibold text-gray-700 bg-gray-50 border border-gray-200 rounded-xl py-2.5">
                {l.label} 공고 ↗
              </a>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

              </div>
              <div className={"text-[22px] font-bold leading-tight mt-1.5 " + w.tier.num}>{wageWon(w.lo)} ~ {wageWon(w.hi)}</div>
              <div className="text-[12px] text-gray-500 mt-1">{MW_YEAR}년 최저임금({wageWon(WAGE_BASE)}) 대비 약 <b className={w.tier.num}>{w.ratio.toFixed(2)}배</b></div>
              <div className="mt-3 h-2 rounded-full bg-white overflow-hidden">
                <div className={"h-full rounded-full " + w.tier.bar} style={{ width: w.pct + "%" }} />
              </div>
              <div className="flex justify-between text-[10px] text-gray-400 mt-1">
                <span>최저임금 {wageWon(WAGE_BASE)}</span><span>{wageWon(WAGE_BASE * 2)}</span>
              </div>
            </div>
            {w.note && <p className="text-[13px] text-gray-700 mt-3 bg-gray-50 rounded-xl p-3.5 leading-relaxed">💡 {w.note}</p>}
            <p className="text-[11px] text-gray-400 mt-2.5 leading-relaxed">{WAGE_SOURCE}</p>
          </div>
        ); })()}
        {TYPE_BRANDS[t.id] && (
          <div className="bg-white px-5 py-5 mt-2">
            <h2 className="text-lg font-bold text-gray-900 mb-3">🏢 이런 곳에서 뽑아요</h2>
            <div className="flex flex-wrap gap-2">
              {TYPE_BRANDS[t.id].map((bd, i) => <span key={i} className="text-[13px] bg-gray-50 border border-gray-200 text-gray-700 font-medium px-3 py-1.5 rounded-full">{bd}</span>)}
            </div>
            <p className="text-[11px] text-gray-400 mt-2">※ 대표 예시예요. 실제 채용은 지점·업체마다 달라요.</p>
          </div>
        )}
        <NearbyPlaces t={t} />
        <div className="bg-white px-5 py-5 mt-2 space-y-6">
          {t.about && (
            <div><h2 className="text-lg font-bold text-gray-900 mb-2">이런 알바예요</h2>
              <p className="text-[15px] text-gray-700 leading-[1.7]">{t.about}</p></div>
          )}
          <div><h2 className="text-lg font-bold text-gray-900 mb-2">이런 일을 해요</h2>
            <ul className="space-y-2">{t.doing.map((d, i) => <li key={i} className="flex gap-2 text-[15px] text-gray-700"><span className="text-brand">•</span>{d}</li>)}</ul></div>
          <div><h2 className="text-lg font-bold text-gray-900 mb-2">이런 사람에게 잘 맞아요</h2>
            <p className="text-[15px] text-gray-700 leading-relaxed bg-brandLt rounded-2xl p-4">{t.goodFor}</p></div>
          {t.hard && (
            <div><h2 className="text-lg font-bold text-gray-900 mb-2">😥 이런 점은 힘들어요</h2>
              <ul className="space-y-2">{t.hard.map((h, i) => <li key={i} className="flex gap-2.5 text-[14px] text-gray-700 bg-red-50 rounded-xl p-3.5"><span className="text-red-400">•</span>{h}</li>)}</ul></div>
          )}
          <div><h2 className="text-lg font-bold text-gray-900 mb-2">💡 미리 알면 좋은 꿀팁</h2>
            <ul className="space-y-2.5">{t.tips.map((tip, i) => <li key={i} className="flex gap-2.5 text-[14px] text-gray-700 items-start"><span className="w-5 h-5 bg-brand text-white rounded-full grid place-items-center text-[11px] font-bold shrink-0 mt-0.5">{i + 1}</span>{tip}</li>)}</ul></div>
        </div>
      </div>
    );
  }
  const b = BASICS.find((x) => x.id === target.id);
  return (
    <div className="pb-16 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label={label} />
      <div className="bg-white px-5 pt-5 pb-6">
        <div className="text-5xl">{b.emoji}</div>
        <h1 className="text-2xl font-bold text-gray-900 mt-2 leading-tight">{b.title}</h1>
        <p className="text-gray-500 mt-2">{b.sub}</p>
      </div>
      {b.intro && (
        <div className="bg-white px-5 py-5 mt-2">
          <p className="text-[15px] text-gray-700 leading-[1.75]">{b.intro}</p>
        </div>
      )}
      {b.sections.map((s, i) => (
        <div key={i} className="bg-white px-5 py-5 mt-2">
          <h2 className="text-lg font-bold text-gray-900 mb-3">{s.h}</h2>
          <ul className="space-y-2.5">{s.points.map((p, j) => <li key={j} className="flex gap-2.5 text-[15px] text-gray-700 leading-relaxed items-start"><span className="w-5 h-5 bg-brand text-white rounded-full grid place-items-center text-[11px] shrink-0 mt-0.5">✓</span>{p}</li>)}</ul>
        </div>
      ))}
      {b.warn && (
        <div className="px-5 py-5">
          <div className="bg-red-50 rounded-2xl p-4 text-[14px] text-red-600 leading-relaxed flex gap-2">
            <span className="shrink-0">⚠️</span><span>{b.warn}</span>
          </div>
        </div>
      )}
      <div className="px-5 pb-2 text-[11px] text-gray-400">※ 법·수치는 {MW_YEAR}년 기준 예시예요.</div>
    </div>
  );
}

/* 월급 계산기 — 시급·근무시간으로 주휴·야간수당 포함 월 예상 급여 */
const MIN_WAGE = MW; // 올해 최저시급 (MW_TABLE)
function CalcRow({ label, hint, value, set, unit }) {
  return (
    <div className="py-3 border-b border-gray-100">
      <div className="flex items-center justify-between">
        <label className="text-[15px] font-medium text-gray-700">{label}</label>
        <div className="flex items-center gap-1.5">
          <input type="number" inputMode="decimal" min="0" value={value} onChange={(e) => set(e.target.value)}
            className="w-28 text-right text-[16px] font-bold text-gray-900 bg-gray-50 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-brand/40" />
          <span className="text-sm text-gray-400 w-6">{unit}</span>
        </div>
      </div>
      {hint && <p className="text-[11px] text-gray-400 mt-1">{hint}</p>}
    </div>
  );
}
/* 결과 카드 안의 보조 금액 칩(일급/주급/월급/총액) */
function CalcFig({ label, value, primary }) {
  return (
    <div className={"rounded-xl px-3 py-2.5 text-center " + (primary ? "bg-white/20" : "bg-white/10")}>
      <div className="text-[11px] text-white/75">{label}</div>
      <div className={"font-extrabold leading-tight mt-0.5 " + (primary ? "text-[19px]" : "text-[16px]")}>{value}<span className="text-[12px] font-bold">원</span></div>
    </div>
  );
}
function Calc() {
  const [mode, setMode] = useState("long"); // long=장기(매주 반복) / short=단기(며칠 근무)
  const [hourly, setHourly] = useState(String(MIN_WAGE));
  const [hpd, setHpd] = useState("8");     // 하루 근무시간
  const [dpw, setDpw] = useState("5");     // 주 근무일수(장기)
  const [days, setDays] = useState("3");   // 총 근무일수(단기)
  const [night, setNight] = useState("0"); // 하루 야간(22~06시) 시간
  const [big5, setBig5] = useState(true);  // 5인 이상 사업장
  const [shortHol, setShortHol] = useState(false); // 단기 주휴수당 반영
  const isShort = mode === "short";

  const num = (v) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
  const H = num(hourly), HPD = num(hpd), NIGHT = Math.min(num(night), HPD);
  const won = (n) => Math.round(n).toLocaleString();

  // 하루 기준 — 두 모드 공통
  const dayBase = H * HPD;                       // 하루 기본급
  const dayNight = big5 ? NIGHT * H * 0.5 : 0;    // 하루 야간 가산
  const dayPay = dayBase + dayNight;             // 일급

  // 장기: 주 근무일수로 주휴·주급·월급
  const DPW = num(dpw);
  const weeklyHours = HPD * DPW;
  const holidayHours = weeklyHours >= 15 ? (Math.min(weeklyHours, 40) / 40) * 8 : 0;
  const holidayPay = holidayHours * H;
  const weekly = dayPay * DPW + holidayPay;
  const monthly = weekly * 4.345;

  // 단기: 총 근무일수로 총 급여 (+옵션: 주휴수당 — 주 근무일수로 완주한 주마다 발생)
  const TD = num(days);
  const shortWeekHours = HPD * DPW;                 // 단기 주휴 판정용(주 근무일수 재사용)
  const shortEligible = shortHol && shortWeekHours >= 15 && DPW > 0;
  const shortFullWeeks = shortEligible ? Math.floor(TD / DPW) : 0;
  const shortHolidayPay = shortEligible ? (Math.min(shortWeekHours, 40) / 40) * 8 * H * shortFullWeeks : 0;
  const total = dayPay * TD + shortHolidayPay;

  return (
    <div className="pb-24 bg-gray-50 min-h-screen">
      <PageHead tag="알바 급여 도구" title="알바 급여 계산기" sub="일급·주급·월급까지 — 단기·장기 알바를 나눠서 계산해요" />

      {/* 단기/장기 모드 전환 */}
      <div className="bg-white px-5 pt-4 pb-1 mt-2">
        <div className="grid grid-cols-2 gap-1.5 bg-gray-100 rounded-xl p-1">
          {[["long", "장기", "매주 반복 근무"], ["short", "단기", "며칠만 일하는 알바"]].map(([m, l, d]) => (
            <button key={m} onClick={() => setMode(m)}
              className={"py-2.5 rounded-lg transition text-center " + (mode === m ? "bg-white shadow-card" : "")}>
              <div className={"text-[14px] font-bold " + (mode === m ? "text-brand" : "text-gray-500")}>{l}</div>
              <div className={"text-[11px] mt-0.5 " + (mode === m ? "text-gray-500" : "text-gray-400")}>{d}</div>
            </button>
          ))}
        </div>
      </div>

      <div className="bg-white px-5 py-2 mt-2">
        <CalcRow label="시급" hint={`${MW_YEAR}년 최저시급 ${MIN_WAGE.toLocaleString()}원${MW_NEXT_NOTE}`} value={hourly} set={setHourly} unit="원" />
        <CalcRow label="하루 근무시간" value={hpd} set={setHpd} unit="시간" />
        {isShort
          ? <CalcRow label="총 근무일수" hint="이 알바로 일하는 전체 날짜 수" value={days} set={setDays} unit="일" />
          : <CalcRow label="주 근무일수" value={dpw} set={setDpw} unit="일" />}
        <CalcRow label="하루 야간 근무" hint="밤 10시~오전 6시 근무 시간 (없으면 0)" value={night} set={setNight} unit="시간" />
        <button onClick={() => setBig5(!big5)} className="w-full flex items-center justify-between py-3.5">
          <span className="text-[15px] font-medium text-gray-700 text-left">5인 이상 사업장 <span className="text-gray-400 text-[13px]">(야간수당 적용)</span></span>
          <span className={"w-11 h-6 rounded-full p-0.5 transition shrink-0 " + (big5 ? "bg-brand" : "bg-gray-200")}>
            <span className={"block w-5 h-5 bg-white rounded-full shadow transition-transform " + (big5 ? "translate-x-5" : "")} />
          </span>
        </button>
        {isShort && (
          <React.Fragment>
            <button onClick={() => setShortHol(!shortHol)} className="w-full flex items-center justify-between py-3.5 border-t border-gray-100">
              <span className="text-[15px] font-medium text-gray-700 text-left">주휴수당 반영 <span className="text-gray-400 text-[13px]">(주 15시간 이상 개근 시)</span></span>
              <span className={"w-11 h-6 rounded-full p-0.5 transition shrink-0 " + (shortHol ? "bg-brand" : "bg-gray-200")}>
                <span className={"block w-5 h-5 bg-white rounded-full shadow transition-transform " + (shortHol ? "translate-x-5" : "")} />
              </span>
            </button>
            {shortHol && <CalcRow label="주 근무일수" hint="한 주에 며칠 나가는지 — 이 주기로 주휴를 계산해요" value={dpw} set={setDpw} unit="일" />}
          </React.Fragment>
        )}
      </div>

      {/* 결과 카드 */}
      <div className="px-5 mt-4">
        <div className="bg-brand rounded-2xl p-5 text-white shadow-soft">
          <div className="text-[13px] text-white/80">{isShort ? `총 예상 급여 (세전) · 근무 ${TD || 0}일` : "월 예상 급여 (세전)"}</div>
          <div className="text-[34px] font-extrabold leading-tight mt-1">{won(isShort ? total : monthly)}<span className="text-xl font-bold">원</span></div>
          <div className="text-[12px] text-white/75 mt-1">{isShort ? `일급 ${won(dayPay)}원 × ${TD || 0}일${shortHolidayPay > 0 ? ` + 주휴 ${won(shortHolidayPay)}원` : ""}` : `주급 ${won(weekly)}원 · 월 4.345주 기준`}</div>
          <div className={"grid gap-2 mt-4 " + (isShort ? (shortHolidayPay > 0 ? "grid-cols-3" : "grid-cols-2") : "grid-cols-3")}>
            {isShort ? (
              <React.Fragment>
                <CalcFig label="일급" value={won(dayPay)} primary={shortHolidayPay <= 0} />
                {shortHolidayPay > 0 && <CalcFig label="주휴 합계" value={won(shortHolidayPay)} />}
                <CalcFig label="총 급여" value={won(total)} primary />
              </React.Fragment>
            ) : (
              <React.Fragment>
                <CalcFig label="일급" value={won(dayPay)} />
                <CalcFig label="주급" value={won(weekly)} />
                <CalcFig label="월급" value={won(monthly)} primary />
              </React.Fragment>
            )}
          </div>
        </div>
      </div>

      {/* 계산 내역 */}
      <div className="bg-white px-5 py-5 mt-4">
        <h2 className="text-lg font-bold text-gray-900 mb-1">계산 내역 <span className="text-[13px] font-medium text-gray-400">({isShort ? "하루 기준" : "주 기준"})</span></h2>
        <div className="divide-y divide-gray-100">
          <div className="flex justify-between py-2.5 text-[15px]"><span className="text-gray-600">기본급 <span className="text-gray-400 text-[13px]">({HPD || 0}시간)</span></span><span className="font-semibold text-gray-900">{won(dayBase)}원</span></div>
          {dayNight > 0 && <div className="flex justify-between py-2.5 text-[15px]"><span className="text-gray-600">야간수당 <span className="text-gray-400 text-[13px]">(하루)</span></span><span className="font-semibold text-gray-900">{won(dayNight)}원</span></div>}
          <div className="flex justify-between py-2.5 text-[15px]"><span className="font-bold text-gray-900">일급 합계</span><span className="font-bold text-brand">{won(dayPay)}원</span></div>
          {isShort ? (
            <React.Fragment>
              <div className="flex justify-between py-2.5 text-[15px]"><span className="text-gray-600">× {TD || 0}일</span><span className="font-semibold text-gray-900">{won(dayPay * TD)}원</span></div>
              {shortHol && shortHolidayPay > 0 && <div className="flex justify-between py-2.5 text-[15px]"><span className="text-gray-600">주휴수당 <span className="text-gray-400 text-[13px]">(주 {DPW || 0}일 개근 × {shortFullWeeks}주)</span></span><span className="font-semibold text-gray-900">{won(shortHolidayPay)}원</span></div>}
              <div className="flex justify-between py-2.5 text-[15px]"><span className="font-bold text-gray-900">총 급여 합계</span><span className="font-bold text-brand">{won(total)}원</span></div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div className="flex justify-between py-2.5 text-[15px]"><span className="text-gray-600">× 주 {DPW || 0}일</span><span className="font-semibold text-gray-900">{won(dayPay * DPW)}원</span></div>
              <div className="flex justify-between py-2.5 text-[15px]"><span className="text-gray-600">주휴수당</span><span className="font-semibold text-gray-900">{won(holidayPay)}원</span></div>
              <div className="flex justify-between py-2.5 text-[15px]"><span className="font-bold text-gray-900">주급 합계</span><span className="font-bold text-brand">{won(weekly)}원</span></div>
            </React.Fragment>
          )}
        </div>
        <div className="mt-3 bg-gray-50 rounded-xl p-3 text-[13px] text-gray-500 leading-relaxed">
          {isShort
            ? <>3.3% 공제 시 총 약 <b className="text-gray-700">{won(total * 0.967)}원</b> — 단기·일용직은 보통 3.3% 원천징수로 정산돼요.</>
            : <>3.3% 공제 시 월 약 <b className="text-gray-700">{won(monthly * 0.967)}원</b> · 4대보험 가입 시 실수령액은 조금 더 줄어요.</>}
        </div>
      </div>

      <div className="px-5 mt-4">
        {isShort ? (
          shortHol && shortWeekHours > 0 && shortWeekHours < 15 ? (
            <div className="bg-red-50 rounded-2xl p-4 text-[14px] text-red-600 leading-relaxed flex gap-2">
              <span className="shrink-0">⚠️</span><span>주 {shortWeekHours}시간이라 주 15시간 미만 — 주휴수당은 발생하지 않아요.</span>
            </div>
          ) : shortHol && shortEligible && shortFullWeeks === 0 && TD > 0 ? (
            <div className="bg-brandLt rounded-2xl p-4 text-[13px] text-gray-600 leading-relaxed flex gap-2">
              <span className="shrink-0">💡</span><span>아직 한 주(주 {DPW || 0}일)를 채우지 못해 주휴가 없어요. 한 주를 개근할 때마다 하루치가 더 붙어요.</span>
            </div>
          ) : (
            <div className="bg-brandLt rounded-2xl p-4 text-[13px] text-gray-600 leading-relaxed flex gap-2">
              <span className="shrink-0">💡</span><span>단기라도 한 주에 15시간 이상 일하고 그 주를 개근하면 <b className="text-gray-800">주휴수당</b>을 받을 수 있어요. 위 <b className="text-brand">주휴수당 반영</b>을 켜면 계산에 더해드려요.</span>
            </div>
          )
        ) : (
          weeklyHours > 0 && weeklyHours < 15 && (
            <div className="bg-red-50 rounded-2xl p-4 text-[14px] text-red-600 leading-relaxed flex gap-2">
              <span className="shrink-0">⚠️</span><span>주 {weeklyHours}시간이라 주 15시간 미만 — 주휴수당은 발생하지 않아요.</span>
            </div>
          )
        )}
        <p className="text-[11px] text-gray-400 mt-3 leading-relaxed">
          ※ 실제 지급액은 사업장 규모·계약 형태·공제에 따라 달라지는 <b>추정치</b>예요. 연장·야간·휴일 가산은 5인 이상 사업장 기준이며, 정확한 계산은 고용노동부(1350)에 문의하세요.
        </p>
      </div>
    </div>
  );
}

/* ============================================================ 계정(이메일 회원가입/로그인) ============================================================ */
function AuthField({ label, type, value, set, placeholder, autoComplete, onEnter }) {

    <div>
      <label className="text-[13px] font-semibold text-gray-600">{label}</label>
      <input type={type} value={value} onChange={(e) => set(e.target.value)} placeholder={placeholder} autoComplete={autoComplete}
        onKeyDown={(e) => { if (e.key === "Enter" && onEnter) onEnter(); }}
        className="w-full mt-1.5 px-4 py-3 text-[15px] bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand focus:ring-2 focus:ring-brand/25" />

  );
}

/* 서버가 허용하는 아바타 목록과 같아야 한다(server.js AVATARS). */
const AVATARS = ["🙂", "😎", "🐣", "🐱", "🐶", "🦊", "🐻", "🦁", "🐼", "🐨", "🐸", "🦄", "⚡", "🌱", "🍀", "🔥"];

/* 프로필 화면의 카드 한 칸. (가이드 화면의 Section 과는 다른 컴포넌트다) */

function Profile({ user, onUser, onLogout, onBack, onAdmin, onRetake, onViewResult, paid }) {
  const [nick, setNick] = useState(user.nickname);
  const [avatar, setAvatar] = useState(user.avatar || AVATARS[0]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [pwOpen, setPwOpen] = useState(false);
  const [cur, setCur] = useState("");
  const [next, setNext] = useState("");
  const [pwMsg, setPwMsg] = useState("");
  const [pwBusy, setPwBusy] = useState(false);

  const dirty = nick.trim() !== user.nickname || avatar !== (user.avatar || AVATARS[0]);
  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(""), 1800); };

  const save = async () => {
    setBusy(true);
    const d = await api("PATCH", "/api/auth/profile", { nickname: nick.trim(), avatar });
    setBusy(false);
    if (d.ok) { onUser(d.user); toast("저장했어요 ✓"); } else toast(d.error || "저장에 실패했어요.");
  };

  const changePw = async () => {
    if (pwBusy) return;
    setPwBusy(true); setPwMsg("");
    const d = await api("PATCH", "/api/auth/password", { current: cur, next });
    setPwBusy(false);
    if (d.ok) { setCur(""); setNext(""); setPwOpen(false); toast("비밀번호를 바꿨어요 ✓"); }
    else setPwMsg(d.error || "변경에 실패했어요.");
  };

  const clearResult = async () => {
    if (!window.confirm("저장된 알바 MBTI 결과를 지울까요?")) return;
    const d = await api("PUT", "/api/me/result", { result: null });
    if (d.ok) { onUser(d.user); LS.set("result", null); toast("결과를 지웠어요"); }
  };

  const logout = async () => { await api("POST", "/api/auth/logout"); onLogout(); };
  const del = async () => {
    if (!window.confirm("정말 탈퇴할까요? 계정과 저장된 결과가 삭제되고 되돌릴 수 없어요.")) return;
    await api("DELETE", "/api/auth/account");
    onLogout();
  };

  const r = user.result;
  const p = r && PERSONAS[r.code];
  const joined = user.createdAt ? new Date(user.createdAt) : null;
  const days = joined ? Math.max(1, Math.floor((Date.now() - joined.getTime()) / 86400000) + 1) : null;

  return (
    <div className="pb-24 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label="홈" />

      {/* 프로필 헤더 */}
      <div className="bg-white px-5 pt-6 pb-6 flex items-center gap-3.5">
        <div className="w-16 h-16 rounded-full bg-brandLt grid place-items-center text-3xl shrink-0">
          {user.avatar || (user.nickname || "?").slice(0, 1)}
        </div>
        <div className="min-w-0">
          <div className="font-bold text-lg text-gray-900 truncate">{user.nickname}</div>
          <div className="text-[13px] text-gray-500 truncate">{user.email}</div>
          {joined && (
            <div className="text-[12px] text-gray-400 mt-0.5">
              {joined.toLocaleDateString("ko-KR")} 가입 · 함께한 지 {days}일째
            </div>
          )}
        </div>
      </div>

      {msg && <p className="px-5 pt-3 text-[13px] font-bold text-brand">{msg}</p>}

      {/* 프로필 편집 */}
      <ProfileCard title="프로필" sub="아바타와 닉네임은 언제든 바꿀 수 있어요.">
        <div className="grid grid-cols-8 gap-1.5">
          {AVATARS.map((a) => (
            <button key={a} onClick={() => setAvatar(a)}
              className={"aspect-square rounded-xl text-xl grid place-items-center press transition " +
                (avatar === a ? "bg-brand/10 ring-2 ring-brand" : "bg-gray-50")}>
              {a}
            </button>
          ))}
        </div>
        <div className="flex gap-2 mt-3.5">
          <input value={nick} onChange={(e) => setNick(e.target.value)} maxLength={20} placeholder="닉네임"
            className="flex-1 min-w-0 px-4 py-3 text-[15px] bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand" />
          <button disabled={busy || !nick.trim() || !dirty} onClick={save}
            className="px-5 bg-brand disabled:bg-gray-200 disabled:text-gray-400 text-white font-bold rounded-xl press shrink-0">
            {busy ? "저장 중" : "저장"}
          </button>
        </div>
      </ProfileCard>

      {/* 내 알바 MBTI */}
      <ProfileCard title="내 알바 MBTI" sub="결과는 계정에 저장돼 다른 기기에서도 이어서 볼 수 있어요.">
        {p ? (
          <>
            <div className="flex items-center gap-3 bg-brandLt rounded-2xl px-4 py-3.5">
              <div className="text-3xl">{p.emoji}</div>
              <div className="min-w-0">
                <div className="font-extrabold text-[16px] text-gray-900">{r.code} · {p.nick}</div>
                <div className="text-[12px] text-gray-500 truncate">{paid ? p.tag : "추천 알바는 프리미엄에서 볼 수 있어요"}</div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2 mt-3">
              <button onClick={onViewResult} className="bg-brand text-white font-bold py-3 rounded-xl press text-[14px]">{paid ? "결과 리포트 보기" : "🔓 결과 잠금 해제"}</button>
              <button onClick={onRetake} className="bg-white border border-gray-200 text-gray-700 font-bold py-3 rounded-xl press text-[14px]">다시 테스트하기</button>
            </div>
            <button onClick={clearResult} className="w-full text-[12px] text-gray-400 mt-2 py-1.5">저장된 결과 지우기</button>
          </>
        ) : (
          <>
            <p className="text-[14px] text-gray-500 leading-relaxed">아직 테스트를 안 하셨어요.<br/>28문항 3분이면 내 유형과 추천 알바를 볼 수 있어요.</p>
            <button onClick={onRetake} className="w-full bg-brand text-white font-bold py-3.5 rounded-xl press mt-3">알바 MBTI 하러 가기</button>
          </>
        )}
      </ProfileCard>

      {/* 계정 보안 */}
      <ProfileCard title="계정" sub="이메일은 로그인 아이디라 바꿀 수 없어요.">
        <div className="flex items-center justify-between py-1">
          <span className="text-[14px] text-gray-500">이메일</span>
          <span className="text-[14px] font-semibold text-gray-800 truncate ml-3">{user.email}</span>
        </div>
        {!pwOpen ? (
          <button onClick={() => setPwOpen(true)} className="w-full bg-white border border-gray-200 text-gray-700 font-bold py-3 rounded-xl press mt-3 text-[14px]">
            비밀번호 변경
          </button>
        ) : (
          <div className="mt-3 space-y-2.5">
            <input type="password" value={cur} onChange={(e) => setCur(e.target.value)} placeholder="현재 비밀번호" autoComplete="current-password"
              className="w-full px-4 py-3 text-[15px] bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand" />
            <input type="password" value={next} onChange={(e) => setNext(e.target.value)} placeholder="새 비밀번호 (6자 이상)" autoComplete="new-password"
              onKeyDown={(e) => e.key === "Enter" && changePw()}
              className="w-full px-4 py-3 text-[15px] bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-brand" />
            {pwMsg && <p className="text-[13px] text-red-500 font-medium">{pwMsg}</p>}
            <div className="grid grid-cols-2 gap-2">
              <button disabled={pwBusy || !cur || next.length < 6} onClick={changePw}
                className="bg-brand disabled:bg-gray-200 disabled:text-gray-400 text-white font-bold py-3 rounded-xl press text-[14px]">
                {pwBusy ? "변경 중" : "변경하기"}
              </button>
              <button onClick={() => { setPwOpen(false); setCur(""); setNext(""); setPwMsg(""); }}
                className="bg-white border border-gray-200 text-gray-600 font-bold py-3 rounded-xl press text-[14px]">취소</button>
            </div>
          </div>
        )}
      </ProfileCard>

      {/* 내 데이터 */}
      <ProfileCard title="내 데이터" sub="계정에 저장된 내 정보를 파일로 받아둘 수 있어요.">
        <a href="/api/me/export" download
          className="block w-full text-center bg-white border border-gray-200 text-gray-700 font-bold py-3 rounded-xl press text-[14px]">
          ⬇ 내 데이터 내려받기 (JSON)
        </a>
      </ProfileCard>

      {/* 관리자(ADMIN_EMAIL 계정)에게만 보인다. 서버가 세션으로 판단한 값이다. */}
      {user.admin && (
        <div className="px-5 mt-5">
          <button onClick={onAdmin} className="w-full bg-gray-900 text-white font-bold py-3.5 rounded-xl press">🛠 관리자 — 가입자 관리</button>
        </div>
      )}

      <div className="px-5 mt-5 space-y-2.5">
        <button onClick={logout} className="w-full bg-white border border-gray-200 text-gray-700 font-bold py-3.5 rounded-xl press">로그아웃</button>
        <button onClick={del} className="w-full text-[13px] text-gray-400 py-2">회원 탈퇴</button>
      </div>
    </div>
  );
}

/* ============================================================ 관리자 화면 ============================================================ */
/* 가입자 통계 + 목록 + 검색 + 계정 삭제. ADMIN_EMAIL 계정으로 로그인했을 때만 열린다.
   접근 통제는 서버(/api/admin/*)가 세션으로 하고, 이 화면은 그 결과를 보여줄 뿐이다. */
function AdminScreen({ onBack }) {
  const [stats, setStats] = useState(null);
  const [list, setList] = useState({ total: 0, users: [] });
  const [reports, setReports] = useState([]);
  const [q, setQ] = useState("");
  const [offset, setOffset] = useState(0);
  const [err, setErr] = useState("");
  const LIMIT = 50;

  const load = async (query = q, off = offset) => {
    const s = await api("GET", "/api/admin/stats");
    if (!s.ok) { setErr(s.error || "관리자 권한이 없어요."); return; }
    setStats({ ...s.stats, storage: s.storage });
    const u = await api("GET", `/api/admin/users?limit=${LIMIT}&offset=${off}&q=${encodeURIComponent(query)}`);
    if (u.ok) setList({ total: u.total, users: u.users });
    const r = await api("GET", "/api/admin/reports");
    if (r.ok) setReports(r.reports);
  };
  useEffect(() => { load("", 0); }, []);

  // 신고 처리 — 내용을 지우거나(관리자 권한으로), 문제없으면 '처리 완료'로 닫는다.
  const delTarget = async (r) => {
    if (!window.confirm("신고된 내용을 삭제할까요?")) return;
    const url = r.targetType === "post" ? "/api/posts/" + r.targetId : "/api/comments/" + r.targetId;
    const d = await api("DELETE", url);
    if (!d.ok) return alert(d.error || "삭제에 실패했어요.");
    await api("POST", `/api/admin/reports/${r.id}/resolve`);
    load();
  };
  const resolve = async (id) => { await api("POST", `/api/admin/reports/${id}/resolve`); load(); };

  const search = () => { setOffset(0); load(q, 0); };
  const page = (d) => { const off = Math.max(0, offset + d * LIMIT); setOffset(off); load(q, off); };
  const del = async (u) => {
    if (!window.confirm(`${u.email} 계정을 삭제할까요? 되돌릴 수 없어요.`)) return;
    const d = await api("DELETE", "/api/admin/users/" + u.id);
    if (d.ok) load(); else alert(d.error || "삭제에 실패했어요.");
  };
  const day = (ts) => (ts ? new Date(ts).toLocaleDateString("ko-KR", { year: "2-digit", month: "2-digit", day: "2-digit" }) : "—");

  if (err) return (
    <div className="pb-24 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label="프로필" />
      <p className="px-5 pt-10 text-center text-gray-500">{err}</p>
    </div>
  );

  return (
    <div className="pb-24 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label="프로필" />
      <PageHead tag="관리자" title="가입자 관리" sub={stats ? `저장소 ${stats.storage}` : "불러오는 중…"} />

      {/* 통계 */}
      <div className="px-5 mt-2 grid grid-cols-3 gap-2">
        {[["전체 가입", stats && stats.total], ["최근 7일", stats && stats.last7d], ["최근 24시간", stats && stats.last24h]].map(([label, v]) => (
          <div key={label} className="bg-white rounded-2xl py-4 text-center shadow-card">
            <div className="text-2xl font-extrabold text-gray-900">{v == null ? "—" : v}</div>
            <div className="text-[11px] text-gray-400 mt-0.5">{label}</div>
          </div>
        ))}
      </div>

      {/* MBTI 분포 */}
      {stats && stats.mbti.length > 0 && (
        <div className="bg-white px-5 py-4 mt-3">
          <div className="text-[13px] font-bold text-gray-600">알바 MBTI 유형 분포</div>
          <div className="mt-2.5 space-y-1.5">
            {stats.mbti.slice(0, 8).map((m) => {
              const top = stats.mbti[0].n || 1;
              const p = PERSONAS[m.code];
              return (
                <div key={m.code} className="flex items-center gap-2">
                  <div className="w-24 shrink-0 text-[12px] font-bold text-gray-700">{p ? p.emoji : "🧬"} {m.code}</div>
                  <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-brand rounded-full" style={{ width: Math.round((m.n / top) * 100) + "%" }} />
                  </div>
                  <div className="w-7 text-right text-[12px] font-bold text-gray-500">{m.n}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* 신고함 — 처리되지 않은 신고 */}
      {reports.length > 0 && (
        <div className="bg-white px-5 py-4 mt-3">
          <div className="text-[13px] font-bold text-red-500">🚨 처리 안 된 신고 {reports.length}건</div>
          <div className="mt-2.5 divide-y divide-gray-50">
            {reports.map((r) => (
              <div key={r.id} className="py-3">
                <div className="flex items-center gap-1.5 text-[11px]">
                  <span className="font-bold text-gray-700 bg-gray-100 px-1.5 py-0.5 rounded">{r.targetType === "post" ? "게시글" : "댓글"}</span>
                  <span className="text-gray-400">{r.reporter || "?"} 신고 · {ago(r.createdAt)}</span>
                </div>
                <div className="text-[13px] text-gray-800 mt-1 font-semibold">사유: {r.reason || "(없음)"}</div>
                <div className="text-[13px] text-gray-500 mt-0.5 line-clamp-2">
                  {r.target ? (r.target.title || r.target.body) : "(이미 삭제된 내용)"}
                </div>
                <div className="flex gap-2 mt-2">
                  {r.target && (
                    <button onClick={() => delTarget(r)} className="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 font-bold text-[12px] press">내용 삭제</button>
                  )}
                  <button onClick={() => resolve(r.id)} className="px-3 py-1.5 rounded-lg bg-gray-100 text-gray-600 font-bold text-[12px] press">처리 완료</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* 검색 */}
      <div className="px-5 mt-3 flex gap-2">
        <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && search()}
          placeholder="이메일·닉네임 검색"
          className="flex-1 min-w-0 px-4 py-2.5 text-[14px] bg-white border border-gray-200 rounded-xl outline-none focus:border-brand" />
        <button onClick={search} className="px-4 bg-gray-900 text-white font-bold rounded-xl press text-[14px] shrink-0">검색</button>
      </div>

      {/* 목록 */}
      <div className="bg-white mt-3 divide-y divide-gray-100">
        {list.users.length === 0 && <p className="text-center text-sm text-gray-400 py-10">가입자가 없어요.</p>}
        {list.users.map((u) => (
          <div key={u.id} className="px-5 py-3 flex items-center gap-3">
            <div className="w-9 h-9 rounded-full bg-brandLt text-brand grid place-items-center font-bold shrink-0">{(u.nickname || "?").slice(0, 1)}</div>
            <div className="flex-1 min-w-0">
              <div className="text-[14px] font-bold text-gray-900 truncate">{u.nickname} <span className="text-[11px] font-normal text-gray-400">#{u.id}</span></div>
              <div className="text-[12px] text-gray-500 truncate">{u.email}</div>
            </div>
            <div className="text-right shrink-0">
              <div className="text-[12px] font-bold text-gray-700">{u.mbti || "—"}</div>
              <div className="text-[11px] text-gray-400">{day(u.createdAt)}</div>
            </div>
            <button onClick={() => del(u)} className="text-[12px] text-red-500 font-semibold px-2 py-1 shrink-0">삭제</button>
          </div>
        ))}
      </div>

      {/* 페이지 */}
      {list.total > LIMIT && (
        <div className="px-5 mt-4 flex items-center justify-between">
          <button disabled={offset === 0} onClick={() => page(-1)} className="px-4 py-2 text-[13px] font-bold text-gray-600 disabled:text-gray-300">‹ 이전</button>
          <span className="text-[12px] text-gray-400">{offset + 1}–{Math.min(offset + LIMIT, list.total)} / {list.total}</span>
          <button disabled={offset + LIMIT >= list.total} onClick={() => page(1)} className="px-4 py-2 text-[13px] font-bold text-gray-600 disabled:text-gray-300">다음 ›</button>
        </div>
      )}
    </div>
  );
}

function AccountScreen({ user, onAuthed, onUser, onLogout, onBack, onAdmin, onRetake, onViewResult, paid }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [nick, setNick] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const submit = async () => {
    if (busy) return;
    setErr(""); setBusy(true);
    const url = mode === "signup" ? "/api/auth/signup" : "/api/auth/login";
    const body = mode === "signup" ? { email, password: pw, nickname: nick } : { email, password: pw };
    const d = await api("POST", url, body);
    setBusy(false);
    if (d.ok && d.user) onAuthed(d.user);
    else setErr(d.error || "문제가 발생했어요.");
  };
  if (user) return <Profile user={user} onUser={onUser} onLogout={onLogout} onBack={onBack} onAdmin={onAdmin} onRetake={onRetake} onViewResult={onViewResult} paid={paid} />;
  return (
    <div className="pb-24 bg-gray-50 min-h-screen">
      <TopBar onBack={onBack} label="홈" />
      <div className="px-5 pt-8">
        <div className="text-4xl">👋</div>
        <h1 className="text-2xl font-bold text-gray-900 mt-3">{mode === "signup" ? "회원가입" : "로그인"}</h1>
        <p className="text-gray-500 mt-1.5 text-[15px]">{mode === "signup" ? "이메일로 간편하게 시작하세요. 결과가 계정에 저장돼요." : "알바 메이트 계정으로 로그인하세요."}</p>
      </div>
      <div className="px-5 mt-6 space-y-3">
        <AuthField label="이메일" type="email" value={email} set={setEmail} placeholder="you@example.com" autoComplete="email" onEnter={submit} />
        <AuthField label="비밀번호" type="password" value={pw} set={setPw} placeholder="6자 이상" autoComplete={mode === "signup" ? "new-password" : "current-password"} onEnter={submit} />
        {mode === "signup" && <AuthField label="닉네임 (선택)" type="text" value={nick} set={setNick} placeholder="비우면 이메일 앞부분으로" autoComplete="nickname" onEnter={submit} />}
        {err && <p className="text-[13px] text-red-500 font-medium">{err}</p>}
        <button disabled={busy} onClick={submit} className="w-full bg-brand disabled:bg-gray-300 text-white font-bold py-3.5 rounded-xl press text-[16px]">
          {busy ? "처리 중…" : (mode === "signup" ? "가입하고 시작하기" : "로그인")}
        </button>
      </div>
      <div className="px-5 mt-4 text-center text-[14px] text-gray-500">
        {mode === "signup"
          ? <>이미 계정이 있나요? <button onClick={() => { setMode("login"); setErr(""); }} className="text-brand font-bold">로그인</button></>
          : <>계정이 없나요? <button onClick={() => { setMode("signup"); setErr(""); }} className="text-brand font-bold">회원가입</button></>}
      </div>
      <p className="px-5 mt-8 text-[11px] text-gray-400 leading-relaxed text-center">로그인하면 알바 MBTI 결과가 계정에 저장되어<br/>다른 기기에서도 이어서 볼 수 있어요.</p>
    </div>
  );
}

/* ============================================================ 초기화면(로그인 게이트) ============================================================ */
/* 로그인하지 않으면 앱 안으로 들어올 수 없다. 앱을 처음 열면 이 화면이 뜬다. */
function AuthGate({ onAuthed }) {
  const [mode, setMode] = useState("login");   // login | signup
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [nick, setNick] = useState("");
  const [busy, setBusy] = useState(false);

          <div>🧬 28문항 알바 MBTI — 나에게 맞는 알바 찾기</div>
          <div>🧮 주휴수당까지 더한 월급 계산기</div>

      <div className="px-5 pt-7 flex-1">
        <div className="flex gap-1 bg-gray-100 p-1 rounded-xl">

          <AuthField label="비밀번호" type="password" value={pw} set={setPw} placeholder="6자 이상" autoComplete={mode === "signup" ? "new-password" : "current-password"} onEnter={submit} />
          {mode === "signup" && <AuthField label="닉네임 (선택)" type="text" value={nick} set={setNick} placeholder="비우면 이메일 앞부분으로" autoComplete="nickname" onEnter={submit} />}
          {err && <p className="text-[13px] text-red-500 font-medium">{err}</p>}
          <button disabled={busy} onClick={submit} className="w-full bg-brand disabled:bg-gray-300 text-white font-bold py-3.5 rounded-xl press text-[16px]">

        <p className="mt-5 text-[12px] text-gray-400 leading-relaxed text-center">

  );
}

/* ============================================================ 커뮤니티 ============================================================
   카테고리 게시판(질문·후기·꿀팁·자유) + 댓글 + 좋아요 + 신고.
   글마다 '익명으로' 를 켤 수 있다 — 서버가 응답에서 작성자를 아예 빼고 내려준다. */
const BOARDS = [
  { key: "question", label: "질문", emoji: "❓" },
  { key: "review", label: "후기", emoji: "⭐" },
  { key: "tip", label: "꿀팁", emoji: "💡" },
  { key: "free", label: "자유", emoji: "💬" },
];
const catOf = (k) => BOARDS.find((c) => c.key === k) || BOARDS[3];

function ago(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "방금";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "일 전";
  return new Date(ts).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" });
}

}
