# Render 무료 플랜은 15분 유휴면 서비스를 재운다. 잠든 뒤 첫 접속자는 서버가
# 깨어날 때까지 Render 의 대기 페이지를 보게 되고, 이게 앱보다 앞단이라
# 코드로는 가릴 수 없다. 그래서 10분마다 깨워 두어 콜드스타트 자체를 없앤다.
# (무료 인스턴스 750시간/월 = 서비스 1개면 24시간 상시 가동이 가능하다)
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 https://albamates.com/api/health)
          echo "status: $code"
          # 콜드스타트로 깨어나는 중이면 5xx 가 잠깐 뜰 수 있다 — 한 번 더 확인한다.
          if [ "$code" != "200" ]; then
            sleep 45
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 https://albamates.com/api/health)
            echo "retry status: $code"
          fi
          [ "$code" = "200" ]
