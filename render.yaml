# Render Blueprint — Dockerfile 기반 웹서비스로 자동 배포.
# Render 대시보드 New → Blueprint 로 이 레포를 연결하면 아래 설정대로 생성됩니다.
services:
  - type: web
    name: alba-mbti
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # 한국에서 가장 가까운 Render 리전
    healthCheckPath: /api/config
    envVars:
      # 값은 레포에 넣지 않고 Render 대시보드에서 입력(보안). sync:false → 배포 시 입력 요청됨.
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
