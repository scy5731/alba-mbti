# Render Blueprint — Dockerfile 웹서비스 + 무료 PostgreSQL(영구 계정 저장).
# 대시보드 New → Blueprint 로 이 레포를 연결하면 아래 설정대로 DB와 서비스가 생성됩니다.
databases:
  - name: alba-db
    plan: free
    region: singapore
    databaseName: alba
    user: alba

services:
  - type: web
    name: alba-mbti
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # 한국에서 가장 가까운 Render 리전
    healthCheckPath: /
    # 커스텀 도메인. Render 가 도메인을 서비스에 붙이고 TLS 인증서를 자동 발급한다.
    # 단 DNS 레코드는 도메인 등록업체에서 직접 넣어야 검증이 통과한다 (DEPLOY.md 참고).
    domains:
      - albamates.com
      - www.albamates.com
    envVars:
      # 계정 저장용 Postgres 연결 문자열 — Blueprint가 위 alba-db에서 자동 주입.
      - key: DATABASE_URL
        fromDatabase:
          name: alba-db
          property: connectionString
      # 세션 서명 키 — Render가 한 번 생성해 배포 간 유지(재배포해도 로그인 유지).
      - key: SESSION_SECRET
        generateValue: true
