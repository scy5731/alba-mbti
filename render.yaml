# Render Blueprint — Dockerfile 웹서비스. DB 는 Render 밖(Neon)에 둔다.
# 대시보드 New → Blueprint 로 이 레포를 연결하면 아래 설정대로 서비스가 생성됩니다.
#
# ⚠ 2026-08-11: 여기 있던 무료 Postgres(alba-db)가 생성 30일 만에 만료돼 사라졌고,
#   앱이 기동을 못 해 사이트가 통째로 내려갔다. Render 무료 DB 는 30일마다 죽으므로
#   운영에 못 쓴다. 그래서 만료가 없는 외부 Postgres(Neon)로 옮기고, 연결 문자열은
#   대시보드에서 직접 넣는다(sync:false).
services:
  - type: web
    name: alba-mbti
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # 한국에서 가장 가까운 Render 리전
    healthCheckPath: /
    # 커스텀 도메인. Render 가 도메인을 서비스에 붙이고 TLS 인증서를 자동 발급한다.
    # 단 DNS 레코드는 도메인 등록업체에서 직접 넣어야 검증이 통과한다 (DEPLOY.md 참고).
    domains:
      - albamates.com
      - www.albamates.com
    envVars:
      # 계정 저장용 Postgres 연결 문자열 — Neon 대시보드에서 복사해 직접 입력.
      # 형식: postgresql://USER:PASS@ep-xxxx.ap-southeast-1.aws.neon.tech/alba?sslmode=require
      # 비우면 앱은 파일 저장소로 뜨는데, Render 디스크는 재배포마다 날아가니 운영에선 반드시 채울 것.
      - key: DATABASE_URL
        sync: false
      # 세션 서명 키 — Render가 한 번 생성해 배포 간 유지(재배포해도 로그인 유지).
      - key: SESSION_SECRET
        generateValue: true
      # 관리자 계정 이메일 — 레포에 넣지 않고 대시보드에서 입력(sync:false)
      - key: ADMIN_EMAIL
        sync: false
      # ── 나이스페이 (NICEPAY API V2 · 서버승인) ──
      # 키는 시크릿이라 레포에 넣지 않는다 — 대시보드에서 직접 입력(sync:false).
      # 둘 다 비어 있으면 결제 기능이 꺼진 채로 뜬다(앱은 전면 무료로 동작).
      # ⚠ R2_ 로 시작하는 실 운영 키를 넣으면 진짜 카드가 승인된다.
      - key: NICEPAY_CLIENT_KEY
        sync: false
      - key: NICEPAY_SECRET_KEY
        sync: false
      # 프리미엄 상세 리포트 판매가(원)
      - key: PRICE_PREMIUM_REPORT
        value: "2990"
      # 결제창이 돌아올 절대 주소(returnUrl 기준). 커스텀 도메인으로 고정한다.
      - key: PUBLIC_BASE_URL
        value: https://albamates.com
