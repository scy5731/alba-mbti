<!-- 아이콘 리브랜딩: 파랑(#2E7CF6) → 초록(#16A34A).
     픽셀을 HSL로 바꿔 색상(H)을 회전하고 채도·명도를 브랜드값에 맞춰 스케일한다.
     흰 배경·회색 등 무채색(S<0.12)은 건드리지 않아 로고 배경이 상하지 않는다.
     사용: recolor.html?src=<png>&size=512  → 헤드리스 크롬으로 캡처 -->
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const q = new URLSearchParams(location.search);
const SRC = q.get("src");
const SIZE = +q.get("size");

/* 파랑 → 초록 변환 파라미터 (HSL 기준)
   #2E7CF6: H 216.6  S 0.917  L 0.573
   #16A34A: H 142.1  S 0.763  L 0.363   */
const DH = 142.1 - 216.6;      // 색상 회전량
const SK = 0.763 / 0.917;      // 채도 스케일
const LK = 0.363 / 0.573;      // 명도 스케일

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (mx === r) h = 60 * (((g - b) / d) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  return [(h + 360) % 360, s, l];
}
function hsl2rgb(h, s, l) {
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}

const img = new Image();
img.onload = () => {
  const cv = document.getElementById("c");
  cv.width = SIZE; cv.height = SIZE;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  const d = ctx.getImageData(0, 0, SIZE, SIZE);
  const p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    if (p[i + 3] === 0) continue;                       // 투명 픽셀은 통과
    let [h, s, l] = rgb2hsl(p[i], p[i + 1], p[i + 2]);
    if (s < 0.12) continue;                             // 흰색·회색 등 무채색은 보존
    const [r, g, b] = hsl2rgb((h + DH + 360) % 360, Math.min(1, s * SK), Math.min(1, l * LK));
    p[i] = r; p[i + 1] = g; p[i + 2] = b;
  }
  ctx.putImageData(d, 0, 0);
  document.title = "done";                              // 캡처 타이밍용 신호
};
img.src = SRC;
</script>
