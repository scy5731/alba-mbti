<!-- 로고 PNG에서 브랜드 초록을 추출. 채도 있는 픽셀만 모아 평균/최명/최암 색을 뽑는다. -->
<meta charset="utf-8">
<style>body{margin:0;font:22px/1.7 monospace;padding:16px;white-space:pre}</style>
<div id="o">loading…</div>
<script>
const SRC = new URLSearchParams(location.search).get("src");
const hex = (r,g,b)=>"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase();
const img = new Image();
img.onload = () => {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, 0, 0);
  const p = x.getImageData(0,0,c.width,c.height).data;
  let n=0, sr=0, sg=0, sb=0;
  let light=null, dark=null, lmax=-1, lmin=2;
  for (let i=0;i<p.length;i+=4){
    const r=p[i],g=p[i+1],b=p[i+2],a=p[i+3];
    if(a<200) continue;
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx-mn < 40) continue;              // 무채색(흰 배경) 제외
    const l=(mx+mn)/2/255;
    n++; sr+=r; sg+=g; sb+=b;
    if(l>lmax){lmax=l; light=[r,g,b];}
    if(l<lmin){lmin=l; dark=[r,g,b];}
  }
  document.getElementById("o").textContent =
    `pixels ${n}
평균(brand)  ${hex(sr/n, sg/n, sb/n)}
가장 밝은 곳 ${hex(...light)}
가장 어두운 곳 ${hex(...dark)}`;
};
img.src = SRC;
</script>
